# 實境冒險的地圖資料（道路、橋、河流、水域）：從 OpenStreetMap 台灣全區資料產生，存到 assets/map/
# 執行方式：GitHub 專案頁 → Actions → 「更新實境地圖資料」→ Run workflow
# 地圖資料 © OpenStreetMap contributors（ODbL），畫面上要保留這行標示
name: 更新實境地圖資料
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝工具
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          python -m pip install -q shapely numpy
      - name: 下載台灣 OpenStreetMap 資料（Geofabrik）
        run: curl -sSL -o taiwan.osm.pbf https://download.geofabrik.de/asia/taiwan-latest.osm.pbf && ls -lh taiwan.osm.pbf
      - name: 篩出道路、河流、水域
        run: |
          osmium tags-filter taiwan.osm.pbf \
            w/highway=motorway,trunk,primary,secondary,tertiary,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link,unclassified,residential,living_street,pedestrian \
            w/waterway=river,canal,stream,drain,ditch,riverbank \
            nwr/natural=water nwr/landuse=reservoir,basin \
            -o filt.osm.pbf --overwrite
          osmium export filt.osm.pbf -f geojsonseq -o filt.geojsonseq --overwrite
          ls -lh filt.osm.pbf filt.geojsonseq
      - name: 切成 0.05 度一塊
        run: python .github/scripts/build_map.py filt.geojsonseq assets/map
      - name: 存回專案
        run: |
          git config user.name "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add -A assets/map
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "更新實境地圖資料（OpenStreetMap 台灣）"
          git pull --rebase
          git push
