<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>管理後台</title>
<style>
:root{--bg:#14110d;--card:#221b13;--line:#3b2e1d;--ink:#eadfc4;--dim:#a08c68;--acc:#c8604a;--ok:#7fb069}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;font-size:15px;line-height:1.5;padding:calc(env(safe-area-inset-top) + 12px) 16px 48px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--dim);font-size:12px;margin:0 0 12px}
button,input,select{font:inherit;color:var(--ink)}
button{background:#4a2a12;border:0;padding:8px 12px;cursor:pointer;box-shadow:0 0 0 2px #1d1008}
button:active{transform:translateY(1px)}button:disabled{opacity:.5}
button.alt{background:#2b241a;box-shadow:0 0 0 2px var(--line)}
input,select{background:#14110d;border:2px solid var(--line);padding:7px 8px;min-width:0}
input[type=number]{width:84px}
#top{display:flex;gap:8px;align-items:center;margin-bottom:10px}#q{flex:1}
.pl{background:var(--card);border:2px solid var(--line);margin-bottom:8px}
.pl>.hd{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;cursor:pointer}
.pl .nm{font-weight:700}.pl .mt{color:var(--dim);font-size:12px}
.pl .bd{padding:4px 12px 12px;border-top:1px dashed var(--line)}
.pl h3{margin:12px 0 6px;font-size:13px;color:var(--dim)}
.rw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}.rw label{min-width:56px;font-size:13px}
#msg{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 14px);max-width:528px;margin-inline:auto;background:#2b241a;border:2px solid var(--line);padding:10px 12px;display:none;z-index:9}
#msg.on{display:block}#msg.err{border-color:var(--acc)}
.note{color:var(--dim);font-size:12px}
</style></head>
<body>
<h1>管理後台</h1><p class="sub">只有管理者帳號能寫入；其他人看得到頁面也改不了。</p>
<div id="box"><p class="note">載入中…</p></div>
<div id="msg" role="status"></div>
<script>
(function(){
var ADMIN='minruu0215@gmail.com',BASE='../assets/data/';
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function withFB(cb){if(window.FB)cb(window.FB);else window.addEventListener('fb-ready',function(){cb(window.FB)},{once:true})}
function toast(t,err){var m=$('msg');m.textContent=t;m.className='on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(function(){m.className=''},2600)}
function csv(n){return fetch(BASE+n+'?v='+Math.floor(Date.now()/300000)).then(function(r){return r.ok?r.arrayBuffer():new ArrayBuffer(0)}).then(function(b){var t=new TextDecoder('utf-8').decode(b).replace(/^\ufeff/,''),L=t.split(/\r?\n/).filter(Boolean);if(!L.length)return[];var h=L[0].split(',');return L.slice(1).map(function(l){var c=l.split(','),o={};h.forEach(function(k,i){o[k.trim()]=(c[i]||'').trim()});return o})})}
var FB,ME=null,PL=[],JOBS=[],WPN=[],PETS=[],open={},WSEL={},JSEL={};
function boot(){withFB(function(f){FB=f;FB.ready.then(function(u){if(!u)return login();gate(u)})})}
function login(){$('box').innerHTML='<p>請先用管理者的 Google 帳號登入。</p><button id="go" type="button">用 Google 登入</button>';$('go').onclick=function(){FB.signIn().then(function(u){gate(u)},function(){toast('登入失敗',1)})}}
function gate(u){if(String(u.email||'').toLowerCase()!==ADMIN){$('box').innerHTML='<p>這個帳號（'+esc(u.email||'')+'）沒有管理權限。</p><button id="so" type="button" class="alt">登出</button>';$('so').onclick=function(){FB.signOut().then(function(){location.reload()})};return}
  ME=u;Promise.all([csv('job_info.csv'),csv('weapon_info.csv'),csv('pet_info.csv'),FB.adminList(200)]).then(function(R){JOBS=R[0];WPN=R[1];PETS=R[2];PL=R[3];draw()},function(e){$('box').innerHTML='<p>載入失敗：'+esc(e&&(e.code||e.message)||'')+'</p>'})}
function draw(){var q=($('q')&&$('q').value||'').trim().toLowerCase();
  var h='<div id="top"><input id="q" type="search" placeholder="搜尋玩家名字" value="'+esc(q)+'"><button id="rf" type="button" class="alt">重新載入</button><button id="so" type="button" class="alt">登出</button></div>';
  var list=PL.filter(function(p){return !q||String(p.name||'').toLowerCase().indexOf(q)>=0});
  h+='<p class="note">共 '+PL.length+' 位玩家（依最近上線排序，最多 200 位）。點名字展開。</p>';
  list.forEach(function(p){var j=JOBS[p.job|0],on=open[p.uid];
    h+='<div class="pl" data-u="'+p.uid+'"><div class="hd" data-a="tg"><span class="nm">'+esc(p.name||'(無名)')+'</span><span class="mt">Lv '+(p.lv|0||1)+'　'+esc(j?j.job_name:'')+'　餅乾 '+(p.cookies|0)+'　鍛造石 '+(p.stones|0)+'</span></div>';
    if(on)h+=body(p);h+='</div>'});
  $('box').innerHTML=h;var qi=$('q');qi.addEventListener('input',function(){var pos=qi.selectionStart;draw();var n=$('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}});
  $('rf').onclick=function(){reload()};$('so').onclick=function(){FB.signOut().then(function(){location.reload()})}}
function body(p){var jsn=JSEL[p.uid]||(JOBS[0]&&JOBS[0].u_sn),jl=((p.jobLv||{})[jsn])|0;
  var h='<div class="bd"><h3>人物等級與經驗池（人物、職業共用）</h3><div class="rw"><label>人物 Lv</label><input type="number" min="1" step="1" id="cl-'+p.uid+'" value="'+Math.max(1,p.lv|0||1)+'"><button type="button" data-a="clset">設成</button></div>'+
   '<div class="rw"><label>經驗池</label><input type="number" min="0" step="1" id="ex-'+p.uid+'" value="'+(p.exp|0)+'"><button type="button" data-a="exset">設成</button></div><div class="rw"><label>增加</label><input type="number" min="1" step="1" id="ea-'+p.uid+'" value="1000"><button type="button" data-a="exadd">加上去</button></div>'+
   '<h3>職業等級（0～50）</h3><div class="rw"><select id="js-'+p.uid+'" data-a="jsel">'+JOBS.map(function(j){return '<option value="'+j.u_sn+'"'+(j.u_sn===jsn?' selected':'')+'>'+esc(j.job_name)+'</option>'}).join('')+'</select><input type="number" min="0" max="50" step="1" id="jl-'+p.uid+'" value="'+jl+'"><button type="button" data-a="jlset">儲存</button></div>'+
   '<h3>寵物餅乾</h3><div class="rw"><label>持有</label><input type="number" min="0" step="1" id="ck-'+p.uid+'" value="'+(p.cookies|0)+'"><button type="button" data-a="ckset">設成</button></div>'+
   '<div class="rw"><label>增加</label><input type="number" min="1" step="1" id="ca-'+p.uid+'" value="10"><button type="button" data-a="ckadd">加上去</button></div><h3>鍛造石</h3><div class="rw"><label>持有</label><input type="number" min="0" step="1" id="sk-'+p.uid+'" value="'+(p.stones|0)+'"><button type="button" data-a="skset">設成</button></div><div class="rw"><label>增加</label><input type="number" min="1" step="1" id="sa-'+p.uid+'" value="1000"><button type="button" data-a="skadd">加上去</button></div><h3>寵物好感等級（0～10）</h3>';
  PETS.forEach(function(pt){var lv=((p.pets||{})[pt.pet_id]||{}).lv|0;h+='<div class="rw"><label>'+esc(pt.pet_name)+'</label><input type="number" min="0" max="10" step="1" id="pt-'+p.uid+'-'+pt.pet_id+'" value="'+lv+'"><button type="button" data-a="pet" data-id="'+pt.pet_id+'">儲存</button></div>'});
  var wsn=WSEL[p.uid]||(WPN[0]&&WPN[0].u_sn),wd=((p.weapons||{})[wsn])||{};
  h+='<h3>武器等級與外觀階</h3><div class="rw"><select id="ws-'+p.uid+'" data-a="wsel">'+WPN.map(function(w){return '<option value="'+w.u_sn+'"'+(w.u_sn===wsn?' selected':'')+'>'+esc(w.weapon_name)+'</option>'}).join('')+'</select></div><div class="rw"><label>Lv</label><input type="number" min="1" step="1" id="wl-'+p.uid+'" value="'+Math.max(1,wd.lv|0||1)+'"><label>外觀階</label><input type="number" min="1" max="4" step="1" id="wt-'+p.uid+'" value="'+Math.min(4,Math.max(1,wd.stage|0||1))+'"><button type="button" data-a="wpn">儲存</button></div>';
  return h+'<p class="note" id="wn-'+p.uid+'"></p></div>'}
function reload(){FB.adminList(200).then(function(l){PL=l;draw();toast('已重新載入')},function(){toast('載入失敗',1)})}
function find(u){return PL.filter(function(p){return p.uid===u})[0]}
function save(u,fields,ok){var b=document.activeElement;FB.adminUpdate(u,fields).then(function(){var p=find(u);if(p){Object.keys(fields).forEach(function(k){var path=k.split('.'),o=p;for(var i=0;i<path.length-1;i++){o[path[i]]=o[path[i]]||{};o=o[path[i]]}o[path[path.length-1]]=fields[k]})}draw();toast(ok||'已儲存')},function(e){toast('寫入失敗：'+(e&&(e.code||e.message)||''),1)})}
function num(id,min,max){var v=parseInt($(id).value,10);if(isNaN(v)||v<min||(max!=null&&v>max))return null;return v}
document.addEventListener('change',function(e){var s=e.target;if(s&&s.getAttribute('data-a')==='jsel'){var c0=s.closest('.pl'),u0=c0&&c0.getAttribute('data-u');if(u0){JSEL[u0]=s.value;draw()}return}if(!s||s.getAttribute('data-a')!=='wsel')return;var card=s.closest('.pl'),u=card&&card.getAttribute('data-u'),p=u&&find(u);if(!p)return;WSEL[u]=s.value;var d=((p.weapons||{})[s.value])||{};$('wl-'+u).value=Math.max(1,d.lv|0||1);$('wt-'+u).value=Math.min(4,Math.max(1,d.stage|0||1))});
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var card=b.closest('.pl');if(!card)return;var u=card.getAttribute('data-u'),a=b.getAttribute('data-a'),p=find(u);
  if(a==='tg'){open[u]=!open[u];draw();return}
  if(a==='ckset'){var v=num('ck-'+u,0);if(v==null)return toast('請輸入 0 以上的整數',1);save(u,{cookies:v},'餅乾已設成 '+v)}
  else if(a==='ckadd'){var d=num('ca-'+u,1);if(d==null)return toast('請輸入 1 以上的整數',1);var nv=(p.cookies|0)+d;save(u,{cookies:nv},'餅乾 +'+d+'，現在 '+nv)}
  else if(a==='skset'){var v2=num('sk-'+u,0);if(v2==null)return toast('請輸入 0 以上的整數',1);save(u,{stones:v2},'鍛造石已設成 '+v2)}
  else if(a==='skadd'){var d2=num('sa-'+u,1);if(d2==null)return toast('請輸入 1 以上的整數',1);var nv2=(p.stones|0)+d2;save(u,{stones:nv2},'鍛造石 +'+d2+'，現在 '+nv2)}
  else if(a==='clset'){var vl=num('cl-'+u,1);if(vl==null)return toast('人物等級要 1 以上',1);save(u,{lv:vl},'人物等級已設成 '+vl)}
  else if(a==='exset'){var ve=num('ex-'+u,0);if(ve==null)return toast('請輸入 0 以上的整數',1);save(u,{exp:ve},'經驗池已設成 '+ve)}
  else if(a==='exadd'){var de=num('ea-'+u,1);if(de==null)return toast('請輸入 1 以上的整數',1);var ne=(p.exp|0)+de;save(u,{exp:ne},'經驗池 +'+de+'，現在 '+ne)}
  else if(a==='jlset'){var js=$('js-'+u).value,vj=num('jl-'+u,0,50);if(vj==null)return toast('職業等級要 0～50',1);var fj={};fj['jobLv.'+js]=vj;JSEL[u]=js;save(u,fj,'職業等級已設成 '+vj)}
  else if(a==='pet'){var id=b.getAttribute('data-id'),lv=num('pt-'+u+'-'+id,0,10);if(lv==null)return toast('等級要是 0～10',1);var f={};f['pets.'+id+'.lv']=lv;save(u,f,'寵物好感已設成 Lv '+lv)}
  else if(a==='wpn'){var sn=$('ws-'+u).value,lv2=num('wl-'+u,1),st=num('wt-'+u,1,4);if(lv2==null||st==null)return toast('Lv 要 1 以上，外觀階 1～4',1);var f2={};f2['weapons.'+sn+'.lv']=lv2;f2['weapons.'+sn+'.stage']=st;WSEL[u]=sn;save(u,f2,'武器已更新')}
});
boot();
})();
</script>
<script type="module" src="../common/fb.js?v=10"></script>
</body></html>
