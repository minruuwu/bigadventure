<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>武器位置調整</title>
<style>
:root{--bg:#1c130d;--panel:#2a1d14;--line:#4a3523;--fg:#eadcbf;--dim:#a4916f;--accent:#f0c24a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Noto Sans TC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px;display:grid;gap:12px}
h1{font-size:18px;margin:4px 0 0}
.lead{margin:0;color:var(--dim);font-size:12.5px}
.stage{background:#8a6a3e;display:flex;justify-content:center;border:2px solid var(--line);padding:6px}
.stage.dark{background:#241a14}
canvas{image-rendering:pixelated;display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row>b{font-weight:400;color:var(--dim);font-size:12px;min-width:3.2em}
button,select{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);padding:6px 10px;min-height:38px;cursor:pointer;touch-action:manipulation}
button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:#3b2a1a}
button:disabled{opacity:.35;cursor:default}
.card{background:var(--panel);border-left:4px solid var(--line);padding:10px 12px;display:grid;gap:10px}
.sl{display:grid;grid-template-columns:3.4em 1fr 3.6em;gap:8px;align-items:center}
.sl input{width:100%;accent-color:var(--accent)}
.sl output{text-align:right;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:center}
.pad button{padding:0;font-size:18px}
.pad .c{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim);text-align:center;line-height:1.2}
.chk{display:flex;align-items:center;gap:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
tr.sel td{background:#3b2a1a;color:var(--accent)}tbody tr{cursor:pointer}
textarea{width:100%;min-height:150px;background:var(--bg);color:var(--fg);border:2px solid var(--line);font:12px/1.4 ui-monospace,monospace;padding:8px}
.note{margin:0;color:var(--dim);font-size:12px}
.msg{color:var(--accent);font-size:12px;min-height:1.2em}
</style></head><body>
<div class="wrap">
 <div><h1>武器位置調整</h1><p class="lead">調整每把武器的切線與位移,參數自動存在這個瀏覽器,最後複製 CSV。四個階段共用同一組數值,可切換階段,或勾選「四階段並排」一次檢查四階。槍的副手盾牌會隨階段換圖。</p></div>
 <div class="stage" id="stage"><canvas id="cv" aria-label="角色預覽"></canvas></div>
 <div class="stage" id="mstage" style="display:none;gap:6px"></div>
 <div class="row" id="wbtn"><b>武器</b></div>
 <div class="row" id="sbtn"><b>階段</b></div>
 <div class="card">
  <div class="sl"><b>切線</b><input type="range" id="cut" min="-14" max="16" step="0.5"><output id="cutv"></output></div>
  <div class="row"><button id="cm">切線 −0.5</button><button id="cp">切線 +0.5</button><span class="note">數字越大,在身體前面的武器越少</span></div>
  <div class="pad" aria-label="位移">
   <span></span><button id="up" aria-label="上">↑</button><span></span>
   <button id="lf" aria-label="左">←</button><span class="c" id="pos"></span><button id="rt" aria-label="右">→</button>
   <span></span><button id="dn" aria-label="下">↓</button><span></span>
  </div>
  <div class="row"><button id="rs">這把武器還原</button><span class="note" id="sh"></span></div>
 </div>
 <div class="card">
  <div class="row"><b>預覽</b>
   <label class="chk"><input type="checkbox" id="oCut"> 顯示切線</label>
   <label class="chk"><input type="checkbox" id="oOut" checked> 黑邊</label>
   <label class="chk"><input type="checkbox" id="oBr" checked> 呼吸</label>
   <label class="chk"><input type="checkbox" id="oDark"> 深色背景</label>
   <label class="chk"><input type="checkbox" id="oMulti"> 四階段並排</label></div>
  <div class="row"><b>外觀</b>
   <select id="sJob"></select><select id="sSkin"></select><select id="sStyle"></select><select id="sEyes"></select><select id="sHair"></select></div>
 </div>
 <div class="card">
  <table><thead><tr><th>武器</th><th>切線</th><th>x</th><th>y</th><th>副手</th></tr></thead><tbody id="tb"></tbody></table>
  <div class="row"><button id="cpAll">複製完整 CSV</button><button id="cp4">只複製四欄</button><button id="dl">下載 weapon_info.csv</button><button id="rsAll">全部還原</button></div>
  <div class="msg" id="msg"></div>
  <textarea id="out" readonly aria-label="CSV"></textarea>
  <p class="note">「只複製四欄」是 cut、offset_x、offset_y、offhand,可以貼進你自己改過名稱的武器表。完整 CSV 是用目前 repo 的武器表加上這四欄。</p>
 </div>
</div>

 for(i=0;i<1600;i++){if(al[i]>0&&al[i]<12)p[i*4+3]=0;else if(al[i]>0&&al[i]<40){var ix=i%40,iy=(i-ix)/40,solid=0;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){var nx=ix+dx,ny=iy+dy;if((dx||dy)&&nx>=0&&nx<40&&ny>=0&&ny<40&&al[ny*40+nx]>=40)solid++}if(!solid)p[i*4+3]=0}}
 var clean=mk(40,40);clean.getContext('2d').putImageData(d,0,0);
 function push(n){if(n>=0&&!out[n]&&p[n*4+3]===0){out[n]=1;q.push(n)}}
 for(i=0;i<40;i++){push(i);push(1560+i);push(i*40);push(i*40+39)}
 while(q.length){var n=q.pop(),cx=n%40,cy=(n-cx)/40;if(cx>0)push(n-1);if(cx<39)push(n+1);if(cy>0)push(n-40);if(cy<39)push(n+40)}
 for(i=0;i<1600;i++){if(!out[i]){p[i*4]=B[0];p[i*4+1]=B[1];p[i*4+2]=B[2];p[i*4+3]=255}else p[i*4+3]=0}
 x.putImageData(d,0,0);x.drawImage(clean,0,0);return c}

/* ---- csv ---- */
function parseCSV(t){t=t.replace(/^﻿/,'');var rows=[],row=[],f='',q=false,i,c;for(i=0;i<t.length;i++){c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function esc(v){return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
var RAW=parseCSV(CSVTXT),HEAD=RAW[0],ROWS=RAW.slice(1),HASCRLF=CSVTXT.indexOf('\r\n')>=0,HASBOM=CSVTXT.charCodeAt(0)===0xFEFF;
var NEWCOLS=['cut','offset_x','offset_y','offhand'];
var KEEP=[];HEAD.forEach(function(h,i){if(NEWCOLS.indexOf(h.trim())<0)KEEP.push(i)});
function col(r,name){var i=HEAD.indexOf(name);return i<0?'':r[i]}
var W=ROWS.map(function(r){return{sn:col(r,'u_sn'),name:col(r,'weapon_name'),cut:parseFloat(col(r,'cut')),ox:parseFloat(col(r,'offset_x')),oy:parseFloat(col(r,'offset_y')),off:col(r,'offhand'),n:[col(r,'stage_1_name'),col(r,'stage_2_name'),col(r,'stage_3_name'),col(r,'stage_4_name')]}});
var ORDER=['劍','斧','匕','弓','錘','杖','槍','書'];
W.sort(function(a,b){return ORDER.indexOf(a.name)-ORDER.indexOf(b.name)});
var INIT={};W.forEach(function(w){if(!w.off&&w.sn==='weapon05')w.off='shield01';INIT[w.sn]={cut:isNaN(w.cut)?1:w.cut,ox:isNaN(w.ox)?0:w.ox,oy:isNaN(w.oy)?0:w.oy}});
var P=JSON.parse(JSON.stringify(INIT));
try{var sv=JSON.parse(localStorage.getItem('wtune_v1')||'null');if(sv)Object.keys(sv).forEach(function(k){if(P[k])P[k]=sv[k]})}catch(e){}
function save(){try{localStorage.setItem('wtune_v1',JSON.stringify(P))}catch(e){}}

/* ---- state ---- */
var S={multi:false,w:0,stage:1,job:0,skin:0,style:0,eyes:5,hair:0,showCut:false,outline:true,breath:true,dark:false};
var skins=[],hairs=[],eyes=[],jobs=[],hairT=[];
function curW(){return W[S.w]}
function wimg(sn,st){return IM[sn+'_'+st]||null}
function stagesOf(sn){var a=[];for(var s=1;s<=4;s++)if(IM[sn+'_'+s])a.push(s);return a}

/* ---- weapon/shield pieces (48x48, art-space with PAD) ---- */
var PC={};
function ringOf(img){ /* alpha mask of art on N grid + ring */
 var c=mk(40,40),x=c.getContext('2d');x.drawImage(img,0,0);var d=x.getImageData(0,0,40,40).data,A=new Uint8Array(N*N),R=new Uint8Array(N*N),X,Y,dx,dy;
 for(Y=0;Y<40;Y++)for(X=0;X<40;X++)if(d[(Y*40+X)*4+3]>10)A[(Y+PAD)*N+X+PAD]=1;
 for(Y=0;Y<N;Y++)for(X=0;X<N;X++){if(A[Y*N+X])continue;for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++){var a=X+dx,b=Y+dy;if(a>=0&&a<N&&b>=0&&b<N&&A[b*N+a]){R[Y*N+X]=1}}}
 return{A:A,R:R,art:c}}
function pieces(img,key,cut,outline,split){
 var k=key+'|'+cut+'|'+outline+'|'+split;if(PC[k])return PC[k];
 var g=ringOf(img),under=mk(N,N),over=mk(N,N),ux=under.getContext('2d'),ox=over.getContext('2d'),ud=ux.createImageData(N,N),od=ox.createImageData(N,N);
 var src=mk(N,N),sx=src.getContext('2d');sx.drawImage(g.art,PAD,PAD);var sd=sx.getImageData(0,0,N,N).data,X,Y,i;
 for(Y=0;Y<N;Y++)for(X=0;X<N;X++){i=Y*N+X;var tgt=ud,isOver=false;
  if(split){var ax=X-PAD,ay=Y-PAD;isOver=(ax+.5-WG[0])*WAX[0]+(ay+.5-WG[1])*WAX[1]>=cut;if(isOver)tgt=od}
  if(g.A[i]){tgt.data[i*4]=sd[i*4];tgt.data[i*4+1]=sd[i*4+1];tgt.data[i*4+2]=sd[i*4+2];tgt.data[i*4+3]=sd[i*4+3]}
  else if(outline&&g.R[i]){tgt.data[i*4]=10;tgt.data[i*4+1]=7;tgt.data[i*4+2]=5;tgt.data[i*4+3]=255}}
 ux.putImageData(ud,0,0);ox.putImageData(od,0,0);return(PC[k]={under:under,over:over})}

/* ---- drawing ---- */
var cv=$('cv'),ctx=cv.getContext('2d'),off=mk(N,N),octx=off.getContext('2d'),scale=8;
var MC=[];
function fit(){var avail=Math.min(window.innerWidth-40,720),s=Math.max(4,Math.min(12,Math.floor(avail/N)));scale=s;cv.width=cv.height=N*s;cv.style.width=cv.style.height=(N*s)+'px';
 var ms=Math.max(2,Math.floor((avail-24)/4/N));MC.forEach(function(c){c.width=c.height=N*ms;c.style.width=c.style.height=(N*ms)+'px'})}
function disp(t){if(!S.breath)return 0;var u=t/PERIOD;u-=Math.floor(u);return Math.round(u<.5?2*u:2*(1-u))}
function squash(img,d){octx.drawImage(img,0,CUTROW,40,40-CUTROW,PAD,PAD+CUTROW,40,40-CUTROW);if(CUTROW-d>0)octx.drawImage(img,0,0,40,CUTROW-d,PAD,PAD+d,40,CUTROW-d)}
var blinkAt=0;
function shieldKey(w,stage){if(!w.off)return '';if(stage>1&&IM['shield_'+stage])return 'shield_'+stage;return w.off}
function drawScene(stage,now){
 var d=disp(now),w=curW(),p=P[w.sn],wi=wimg(w.sn,stage)||wimg(w.sn,1),closed=(now%4000)<130;
 octx.clearRect(0,0,N,N);
 octx.fillStyle='rgba(0,0,0,.38)';var sy=PAD;octx.fillRect(PAD+14,sy+34,7,1);octx.fillRect(PAD+12,sy+35,11,1);octx.fillRect(PAD+11,sy+36,13,1);octx.fillRect(PAD+10,sy+37,15,1);octx.fillRect(PAD+12,sy+38,11,1);
 var pc=wi?pieces(wi,w.sn+'_'+(wimg(w.sn,stage)?stage:1),p.cut,S.outline,true):null;
 if(pc)octx.drawImage(pc.under,p.ox,p.oy+d);
 squash(skins[S.skin],d);squash(jobs[S.job],d);
 if(pc)octx.drawImage(pc.over,p.ox,p.oy+d);
 if(!closed)octx.drawImage(eyes[S.eyes],PAD,PAD+d);
 octx.drawImage(hairT[S.style][S.hair],PAD,PAD+d);
 var sk=shieldKey(w,stage);if(sk&&IM[sk]){var sp=pieces(IM[sk],sk,0,S.outline,false);octx.drawImage(sp.under,0,d)}
 return d}
function frame(now){requestAnimationFrame(frame);
 var d=drawScene(S.stage,now),w=curW(),p=P[w.sn];
 ctx.clearRect(0,0,cv.width,cv.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(off,0,0,N,N,0,0,cv.width,cv.height);
 if(S.showCut){var gx=WG[0]+WAX[0]*p.cut,gy=WG[1]+WAX[1]*p.cut,vx=-WAX[1],vy=WAX[0];
  function T(x,y){return[(x+PAD+p.ox)*scale,(y+PAD+p.oy+d)*scale]}
  var a=T(gx-vx*30,gy-vy*30),b=T(gx+vx*30,gy+vy*30);ctx.strokeStyle='#ff2bd6';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.setLineDash([])}
 if(S.multi){for(var i=1;i<=4;i++){var mc=MC[i-1];if(!mc)continue;drawScene(i,now);var m=mc.getContext('2d');m.clearRect(0,0,mc.width,mc.height);m.imageSmoothingEnabled=false;m.drawImage(off,0,0,N,N,0,0,mc.width,mc.height)}}
}

/* ---- ui ---- */
function csvFull(){var head=KEEP.map(function(i){return HEAD[i]}).concat(NEWCOLS),nl=HASCRLF?'\r\n':'\n';
 var lines=[head.map(esc).join(',')];
 ROWS.forEach(function(r){var sn=col(r,'u_sn'),p=P[sn]||{cut:1,ox:0,oy:0},w=W.filter(function(x){return x.sn===sn})[0];lines.push(KEEP.map(function(i){return esc(r[i]==null?'':r[i])}).concat([String(p.cut),String(p.ox),String(p.oy),w&&w.off?w.off:'']).map(function(v){return v}).join(','))});
 return lines.join(nl)+nl}
function csv4(){var nl='\n',l=['u_sn,cut,offset_x,offset_y,offhand'];ROWS.forEach(function(r){var sn=col(r,'u_sn'),p=P[sn],w=W.filter(function(x){return x.sn===sn})[0];l.push([sn,p.cut,p.ox,p.oy,w.off||''].join(','))});return l.join(nl)+nl}
function refresh(){var w=curW(),p=P[w.sn];
 $('cut').value=p.cut;$('cutv').textContent=p.cut;$('pos').textContent='x '+p.ox+'\ny '+p.oy;$('pos').style.whiteSpace='pre';
 Array.prototype.forEach.call($('wbtn').querySelectorAll('button'),function(b,i){b.setAttribute('aria-pressed',i===S.w)});
 var st=stagesOf(w.sn);if(st.indexOf(S.stage)<0)S.stage=st[0]||1;
 Array.prototype.forEach.call($('sbtn').querySelectorAll('button'),function(b,i){b.disabled=st.indexOf(i+1)<0;b.textContent=(i+1)+(w.n&&w.n[i]?' '+w.n[i]:'');b.setAttribute('aria-pressed',S.stage===i+1)});
 $('sh').textContent=w.off?'這把武器搭配副手:'+w.off+'(固定在最上層,無切線與位移)':'';
 var tb=$('tb');tb.textContent='';W.forEach(function(x,i){var tr=document.createElement('tr');if(i===S.w)tr.className='sel';var q=P[x.sn];[x.name,q.cut,q.ox,q.oy,x.off||''].forEach(function(v){var td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tr.addEventListener('click',function(){S.w=i;refresh()});tb.appendChild(tr)});
 $('out').value=csvFull();save()}
function setP(f){var p=P[curW().sn];f(p);refresh()}
function msg(t){$('msg').textContent=t;setTimeout(function(){if($('msg').textContent===t)$('msg').textContent=''},2500)}
function copy(txt,okMsg){var ta=$('out');var done=function(){msg(okMsg)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,function(){ta.value=txt;ta.select();document.execCommand('copy');done()});else{ta.value=txt;ta.select();try{document.execCommand('copy')}catch(e){}done()}}
function hold(id,fn){var b=$(id),t=null,iv=null;function stop(){clearTimeout(t);clearInterval(iv)}b.addEventListener('pointerdown',function(e){e.preventDefault();fn();t=setTimeout(function(){iv=setInterval(fn,80)},350)});['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,stop)})}

function init(){
 var names=['body_a','body_b','body_c'];names.forEach(function(n,i){skins[i]=IM[n]});
 for(var i=1;i<=8;i++)eyes[i-1]=IM['eyes_'+i];for(i=1;i<=5;i++){hairs[i-1]=IM['hair_0'+i];jobs[i-1]=IM['job0'+i]}
 hairs.forEach(function(h,si){hairT[si]=HAIR.map(function(t){return makeHair(h,t)})});
 W.forEach(function(w,i){var b=document.createElement('button');b.textContent=w.name;b.addEventListener('click',function(){S.w=i;refresh()});$('wbtn').appendChild(b)});
 [1,2,3,4].forEach(function(s){var b=document.createElement('button');b.textContent=s;b.addEventListener('click',function(){S.stage=s;refresh()});$('sbtn').appendChild(b)});
 function fill(id,arr){arr.forEach(function(n,i){var o=document.createElement('option');o.value=i;o.textContent=n;$(id).appendChild(o)})}
 fill('sJob',JOBN);fill('sSkin',SKINN);fill('sStyle',[1,2,3,4,5].map(function(i){return'髮型 '+i}));fill('sEyes',[1,2,3,4,5,6,7,8].map(function(i){return'眼色 '+i}));fill('sHair',HAIR.map(function(h){return h.n}));
 $('sEyes').value=S.eyes;
 [['sJob','job'],['sSkin','skin'],['sStyle','style'],['sEyes','eyes'],['sHair','hair']].forEach(function(a){$(a[0]).addEventListener('change',function(){S[a[1]]=+this.value})});
 $('cut').addEventListener('input',function(){setP(function(p){p.cut=parseFloat($('cut').value)})});
 $('cm').addEventListener('click',function(){setP(function(p){p.cut=Math.max(-14,p.cut-.5)})});$('cp').addEventListener('click',function(){setP(function(p){p.cut=Math.min(16,p.cut+.5)})});
 hold('up',function(){setP(function(p){p.oy--})});hold('dn',function(){setP(function(p){p.oy++})});hold('lf',function(){setP(function(p){p.ox--})});hold('rt',function(){setP(function(p){p.ox++})});
 $('rs').addEventListener('click',function(){var sn=curW().sn;P[sn]=JSON.parse(JSON.stringify(INIT[sn]));refresh()});
 $('rsAll').addEventListener('click',function(){if(confirm('全部還原成最初的數值?')){P=JSON.parse(JSON.stringify(INIT));refresh()}});
 $('oCut').addEventListener('change',function(){S.showCut=this.checked});$('oOut').addEventListener('change',function(){S.outline=this.checked});$('oBr').addEventListener('change',function(){S.breath=this.checked});
 $('oDark').addEventListener('change',function(){S.dark=this.checked;$('stage').className='stage'+(this.checked?' dark':'');$('mstage').className='stage'+(this.checked?' dark':'')});
 $('oMulti').addEventListener('change',function(){S.multi=this.checked;$('mstage').style.display=this.checked?'flex':'none'});
 for(var mi=0;mi<4;mi++){var mcv=document.createElement('canvas');mcv.style.imageRendering='pixelated';$('mstage').appendChild(mcv);MC.push(mcv)}
 $('cpAll').addEventListener('click',function(){copy(csvFull(),'已複製完整 CSV')});$('cp4').addEventListener('click',function(){copy(csv4(),'已複製四欄')});
 $('dl').addEventListener('click',function(){var b=new Blob([(HASBOM?'﻿':'')+csvFull()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='weapon_info.csv';document.body.appendChild(a);a.click();a.remove()});
 window.addEventListener('resize',fit);fit();refresh();requestAnimationFrame(frame)}
var keys=Object.keys(IM),left=keys.length;
keys.forEach(function(k){var im=new Image();im.onload=function(){IM[k]=im;if(--left===0)init()};im.onerror=function(){IM[k]=null;if(--left===0)init()};im.src=IM[k]});
})();
</script></body></html>
