<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>冒險</title>
<style>
:root{color-scheme:dark;--bg:#120c08;--fg:#eadbbd;--dim:#aab5c4;--accent:#e0b84a;--red:#d4553f;--edge:#06080b;--hi:#5d6b7c;--btn:#4a2a12;--btn-hi:#6b4a2a;--gold:#ffd76a;--font:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#120c08 var(--wall,none);background-size:96px 48px;image-rendering:pixelated;color:var(--fg);font-family:var(--font);line-height:1.5;font-weight:500}
canvas{image-rendering:pixelated}
button{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#1f262e;border-bottom:4px solid #06080b;box-shadow:inset 0 -3px 0 #5d6b7c,0 4px 0 rgba(0,0,0,.4)}
.top h1{margin:0;font-size:18px;font-weight:900;letter-spacing:.3em;text-shadow:2px 2px 0 #000}
.tag{font-size:12px;font-weight:900;color:#1d1008;background:var(--accent);padding:1px 8px;box-shadow:0 0 0 2px #080503}
.main{flex:1;padding:14px 18px 100px;display:flex;flex-direction:column;gap:12px}
.hint{font-size:12px;color:var(--gold);margin:0;text-shadow:1px 1px 0 #000;font-weight:700}
.frame{position:relative;width:100%;aspect-ratio:160/140;box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi);overflow:hidden;background:#1a1410}
.bg,.fgl{position:absolute;inset:0;background-repeat:repeat-x;background-size:auto 100%;background-position:0 0;image-rendering:pixelated}
.fgl{z-index:200;pointer-events:none}.fgl[hidden]{display:none}
.sky{position:absolute;inset:0;background:linear-gradient(#4f9fe0,#a9d6f2 70%);overflow:hidden}
.sky canvas{position:absolute;left:0;top:0;height:100%;width:auto}
.sp{position:absolute;image-rendering:pixelated;transform-origin:50% 100%;will-change:transform,left,top}
.sh{position:absolute;background:rgba(0,0,0,.38);border-radius:50%}
.panel{background:rgba(20,12,8,.82);box-shadow:0 0 0 2px #080503,inset 0 0 0 2px #6b4a2a;padding:10px 12px;display:grid;gap:8px}
.panel h2{margin:0;font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.1em}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{white-space:nowrap;font-weight:900;font-size:14px;border:0;background:var(--btn);padding:8px 12px;cursor:pointer;box-shadow:0 0 0 2px #1d1008;min-width:0}
.seg button.on{background:#c9893f;color:#1d1008}
.seg button:active{background:var(--btn-hi)}
.note{font-size:11px;color:var(--dim);margin:0}
#loading{padding:30px;text-align:center;color:var(--dim)}#loading.err{color:#e5645a}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);background:#1f262e;border-top:4px solid #06080b;box-shadow:inset 0 3px 0 #5d6b7c;z-index:5}
.tab{position:relative;background:none;border:0;color:var(--dim);font-size:12px;font-weight:700;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:68px;text-shadow:1px 1px 0 #000}
.tab canvas{filter:saturate(.3) brightness(.62)}
.tab[aria-selected="true"]{color:var(--accent);background:#34404d;box-shadow:inset 0 3px 0 var(--accent)}
.tab[aria-selected="true"] canvas{filter:none}
.tabs{background:#2a1b0f;border-top-color:#080503;box-shadow:inset 0 3px 0 #6b4a2a}
.tab[aria-selected="true"]{background:#3d2814}
.map{position:relative;width:100%;box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi);line-height:0}
.map img{display:block;width:100%;height:auto;image-rendering:pixelated;user-select:none;-webkit-user-select:none}
#zones{position:absolute;inset:0}
.zone{position:absolute;left:0;right:0;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:flex-end;justify-content:flex-start;-webkit-tap-highlight-color:transparent}
.zone:active,.zone:focus-visible{background:rgba(255,230,140,.12);outline:none}
.zn{margin:0 0 6px 6px;font-size:12px;font-weight:900;line-height:1.4;color:#f6e6c8;background:rgba(18,10,4,.78);padding:1px 7px;box-shadow:0 0 0 2px #080503,inset 0 0 0 1px #6b4a2a;text-shadow:1px 1px 0 #000}
.orb{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:#7dff8a;box-shadow:0 0 0 2px #1d5a24,0 0 8px 4px rgba(90,255,120,.75),0 0 22px 10px rgba(60,230,90,.4);border-radius:50%;animation:orb 1.8s ease-in-out infinite}
.orb::after{content:"";position:absolute;left:3px;top:2px;width:4px;height:4px;background:#e8ffe8;border-radius:50%}
@keyframes orb{0%,100%{transform:scale(.88);opacity:.85}50%{transform:scale(1.12);opacity:1}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.bhead{text-align:center;font-size:15px;font-weight:900;letter-spacing:.12em;padding:8px 0;margin-bottom:10px;background:#1f262e;box-shadow:0 0 0 2px #06080b,inset 0 -3px 0 #5d6b7c;text-shadow:1px 1px 0 #000}
.bhead.win{font-size:22px;color:#ffd76a;background:#3a2a0c;box-shadow:0 0 0 2px #06080b,inset 0 -3px 0 #a87a22}
.bhead.lose{font-size:22px;color:#ff9a8a;background:#3a1210;box-shadow:0 0 0 2px #06080b,inset 0 -3px 0 #8a2a20}
#batv .panel{margin-top:12px}
.log{height:190px;overflow-y:auto;font-size:12.5px;line-height:1.55;overscroll-behavior:contain}
.lg{padding:1px 0;color:var(--fg)}.lg.rd{color:var(--accent);font-weight:900;margin-top:4px}.lg.ko{color:#ff9a8a;font-weight:900}
.bres{margin-top:12px;background:rgba(20,12,8,.82);box-shadow:0 0 0 2px #080503,inset 0 0 0 2px #6b4a2a;padding:12px;text-align:center}
.bres p{margin:0 0 10px;font-size:14px;line-height:1.7}.bres b{color:#ffd76a}.bres small{color:var(--dim)}
.go{display:block;width:100%;font-weight:900;font-size:15px;border:0;background:#3f6a2c;color:#f0e2c4;padding:10px 0;cursor:pointer;box-shadow:0 0 0 2px #1d1008,inset 0 2px 0 #6a9a4c,inset 0 -2px 0 #24401a}
.go:disabled{opacity:.45;cursor:default}
.lvov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:10vh 18px 20px}
.lvov[hidden]{display:none}.lvbg{position:fixed;inset:0;background:rgba(0,0,0,.62)}
.lvbox{position:relative;width:100%;max-width:340px;background:#b98a57;color:#2e1d0e;padding:18px 16px 16px;box-shadow:inset 0 0 0 3px #3b2713,inset 0 0 0 6px #7a5426,6px 6px 0 rgba(0,0,0,.5)}
.lvbox h2{margin:0;font-size:19px;font-weight:900;color:#2a1708}.lvh{margin:2px 0 10px;font-size:12px;font-weight:700;color:#5a3a1a}
.lvbox .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border:0;background:#4a2a12;color:#f0dfb8;font-weight:900;cursor:pointer;box-shadow:0 0 0 2px #1d1008}
.lvg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv{font-weight:900;font-size:15px;border:0;background:#4a2a12;color:#f0dfb8;padding:9px 0;cursor:pointer;box-shadow:0 0 0 2px #1d1008}
.lv.boss{background:#7a1f14;font-size:13px}.lv.on{background:#e0b84a;color:#1d1008}
.lvinfo{margin:10px 0;font-size:13px;font-weight:700;min-height:2.6em;line-height:1.5}
.fover{position:absolute;inset:0;z-index:400;background:rgba(6,4,2,.66);display:flex;align-items:center;justify-content:center;padding:10px;animation:fdark .5s ease-out both}
.fover[hidden]{display:none}@keyframes fdark{from{background:rgba(6,4,2,0)}to{background:rgba(6,4,2,.66)}}
.rbox{width:100%;max-width:260px;text-align:center;background:rgba(20,12,8,.9);box-shadow:0 0 0 2px #080503,inset 0 0 0 2px #6b4a2a;padding:10px 12px 12px}
.rt{font-size:20px;font-weight:900;letter-spacing:.3em;margin-bottom:4px;text-shadow:2px 2px 0 #000}.rt.win{color:#ffd76a}.rt.lose{color:#ff9a8a}
.rbox p{margin:0 0 10px;font-size:13px;line-height:1.6}.rbox b{color:#ffd76a}.rbox small{color:var(--dim)}
</style></head><body>

<script>
(function(){
var OUT='#241610';
var C={steel:'#c6ced8',steelM:'#8d98a8',steelD:'#59627a',wood:'#a06f3c',woodD:'#6b4423',canvas:'#e6d3a8',canvasD:'#c4a874',red:'#c0463a',redD:'#8a2a20',gold:'#e0b84a',goldD:'#a87a22',par:'#eadbbd',ink:'#5a3a20',hot:'#f08a3a',skin:'#e2b48a',blue:'#4f8fd8',blueD:'#2f5d9a',green:'#5fae52',dark:'#3a2414'};
function make(draw,N,noOut){N=N||14;var g=[];for(var y=0;y<N;y++){g[y]=[];}
  function set(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<N&&y<N)g[y][x]=c}
  var api={
    rect:function(x0,y0,x1,y1,c){for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++)set(x,y,c)},
    poly:function(p,c){for(var y=0;y<N;y++)for(var x=0;x<N;x++){var px=x+.5,py=y+.5,ins=false;
      for(var i=0,j=p.length-1;i<p.length;j=i++){var xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))ins=!ins}
      if(ins)g[y][x]=c}},
    disc:function(cx,cy,r,c){for(var y=0;y<N;y++)for(var x=0;x<N;x++){var dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy<=r*r)g[y][x]=c}},
    line:function(x0,y0,x1,y1,c){var n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2);for(var i=0;i<=n;i++){var t=i/n;set(x0+(x1-x0)*t,y0+(y1-y0)*t,c)}},
    px:function(x,y,c){set(x,y,c)},
    clr:function(cx,cy,r){for(var y=0;y<N;y++)for(var x=0;x<N;x++){var dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy<=r*r)g[y][x]=undefined}}
  };
  draw(api);
  var cv=document.createElement('canvas');cv.width=cv.height=N+2;var x=cv.getContext('2d');
  for(var yy=-1;yy<=N;yy++)for(var xx=-1;xx<=N;xx++){var c=g[yy]&&g[yy][xx];
    if(c){x.fillStyle=c;x.fillRect(xx+1,yy+1,1,1)}
    else{var nb=[[1,0],[-1,0],[0,1],[0,-1]].some(function(d){var q=g[yy+d[1]]&&g[yy+d[1]][xx+d[0]];return q});
      if(nb&&!noOut){x.fillStyle=OUT;x.fillRect(xx+1,yy+1,1,1)}}}
  return cv}
var ICON={
 camp:{n:'帳篷',draw:function(a){
   a.poly([[7,.5],[14,14],[0,14]],C.canvas);a.poly([[7,.5],[14,14],[7,14]],C.canvasD);

   a.rect(0,12,13,12,C.redD);a.px(7,0,C.wood);a.px(8,0,C.red);a.px(9,0,C.red)}},

 compass:{n:'羅盤',draw:function(a){

   a.px(1,6,C.ink);a.px(1,7,C.ink);a.px(12,6,C.ink);a.px(12,7,C.ink);a.rect(6,6,7,7,C.ink)}},
 map:{n:'摺疊地圖',draw:function(a){
   a.poly([[0.5,3],[4.5,2],[4.5,12],[0.5,13]],'#d8c18c');a.poly([[4.5,2],[9,3],[9,13],[4.5,12]],'#f0e0b8');a.poly([[9,3],[13.5,2],[13.5,12],[9,13]],'#cdb27a');
   a.line(4.5,2,4.5,12,'#8a6a3a');a.line(9,3,9,13,'#8a6a3a');
   a.px(2,6,C.green);a.px(2,7,C.green);a.px(3,7,C.green);
   a.px(6,4,C.blue);a.px(7,5,C.blue);a.px(6,7,C.blue);a.px(7,9,C.blue);
   a.line(5.5,6,8,9,C.red);a.line(8,6,5.5,9,C.red);
   a.px(11,5,C.ink);a.px(12,8,C.ink);a.px(11,10,C.ink)}},
 banner:{n:'旗幟',draw:function(a){
   a.rect(2,0,2,13,C.wood);a.px(2,0,C.gold);
   a.poly([[3,1.5],[12.5,1.5],[12.5,9.5],[8,7.5],[3,9.5]],C.red);a.poly([[3,1.5],[12.5,1.5],[12.5,3],[3,3]],C.redD);
   a.rect(1,13,4,13,C.woodD)}},
 trio:{n:'三人頭像',draw:function(a){
   a.rect(0,9,5,13,C.blueD);a.disc(2.8,6,2.2,C.skin);a.rect(1,3.6,4,4.4,'#6b4423');
   a.rect(8,9,13,13,C.green);a.disc(10.8,6,2.2,C.skin);a.rect(9,3.6,12,4.4,C.gold);
   a.rect(3,9,10,13,C.red);a.disc(6.5,4.6,2.8,C.skin);a.rect(3.8,1.6,9,3.2,'#3a2414');a.px(5,5,C.ink);a.px(8,5,C.ink)}},
 shield:{n:'盾牌',draw:function(a){
   a.poly([[1,0.8],[13,0.8],[13,7],[7,13.6],[1,7]],C.steelM);a.poly([[2.2,2],[11.8,2],[11.8,6.6],[7,11.6],[2.2,6.6]],C.red);
   a.rect(6,2,7,10,C.gold);a.rect(2,5,11,5,C.gold)}},
 scroll:{n:'羊皮紙卷',draw:function(a){
   a.rect(2,2,11,11,C.par);a.rect(2,2,2,11,'#d6c294');
   a.rect(0,0,13,2,C.canvasD);a.rect(0,1,13,1,C.canvas);a.rect(0,11,13,13,C.canvasD);a.rect(0,12,13,12,C.canvas);
   a.rect(4,4,9,4,C.ink);a.rect(4,6,10,6,C.ink);a.rect(4,8,8,8,C.ink)}},
 gear:{n:'齒輪',draw:function(a){
   a.disc(7,7,4.6,C.steelM);

};

function cv(src,scale){var c=document.createElement('canvas');c.width=src.width;c.height=src.height;c.getContext('2d').drawImage(src,0,0);c.style.width=src.width*scale+'px';c.style.height=src.height*scale+'px';return c}
var BASE='../assets/',V='5';

function fixT(s){return String(s||'').replace(/爆擊/g,'暴擊')}
function pct(s){return parseFloat(String(s||'').replace('%',''))||0}
function parseCSV(t){t=t.replace(/^﻿/,'');var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){var c=t.charAt(i);
    if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t.charAt(i+1)==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  var head=rows.shift().map(function(h){return h.trim()});
  return rows.map(function(r){var o={};head.forEach(function(h,k){o[h]=(r[k]==null?'':r[k]).trim()});return o})}
function getCSV(n){return fetch(BASE+'data/'+n+'?v='+V+'.'+Math.floor(Date.now()/300000)).then(function(r){if(!r.ok)throw new Error(n+' '+r.status);return r.arrayBuffer()}).then(function(b){return parseCSV(new TextDecoder('utf-8').decode(b))})}
function loadImg(src){return new Promise(function(res){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){res(null)};im.src=src})}
function buildData(R){
  R[0].forEach(function(r){var k=r.u_sn;if(!k)return;ORDER.push(k);var au=[],tm=[];
    var ph=parseFloat(r.p_atk_lv100)||0,mg=parseFloat(r.m_atk_lv100)||0;
    [1,2,3,4,5,6].forEach(function(n){var s=r['auto_stat_'+n];if(!s)return;var v=r['auto_per_level_'+n];if(s==='p_atk')ph=(parseFloat(v)||0)*100;else if(s==='m_atk')mg=(parseFloat(v)||0)*100;else au.push({l:STATL[s]||s,per:pct(v),u:'%'})});
    [1,2,3].forEach(function(n){var s=r['temper_stat_'+n];if(s)tm.push({l:STATL[s]||s,per:pct(r['temper_per_point_'+n]),u:'%'})});

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}

    ms.push({k:k,n:nm,boss:boss,hp:0})}

  var ev=[],pko={},mko={},rd=0;

  function aliveP(){return P.map(function(x,i){return x.hp>0?i:-1}).filter(function(i){return i>=0})}

    var order=[];P.forEach(function(x,i){if(x.hp>0)order.push(['p',i])});ms.forEach(function(m,i){if(m.hp>0)order.push(['m',i])});order.sort(function(){return Math.random()-.5});
    order.forEach(function(o){if(!aliveM().length||!aliveP().length)return;
      if(o[0]==='p'){var x=P[o[1]];if(x.hp<=0)return;var s=skillOf(x.p,x.cy++);
        if(s.ty==='heal'){var al=aliveP(),tg=al[rnd(0,al.length-1)];ev.push({side:'p',a:o[1],tg:[],txt:x.n+' 使用「'+s.n+'」，'+P[tg].n+' 恢復 '+rnd(pd,pd*2)+' 生命'});return}
        if(s.ty==='buff'){ev.push({side:'p',a:o[1],tg:[],txt:x.n+' 使用「'+s.n+'」'});return}

        ev.push({side:'p',a:o[1],tg:tgs,txt:x.n+' 使用「'+s.n+'」→ '+parts.join('，'),dead:dead})}
      else{var m=ms[o[1]];if(m.hp<=0)return;var ap=aliveP(),ti=ap[rnd(0,ap.length-1)],t2=P[ti];
        if(Math.random()<.12){ev.push({side:'m',a:o[1],tgt:-1,txt:m.n+' 攻擊 '+t2.n+'，被閃開了'});return}
        var d=Math.round(md*(.85+Math.random()*.3));t2.hp-=d;ev.push({side:'m',a:o[1],tgt:ti,txt:m.n+' 攻擊 '+t2.n+'，造成 '+d+' 傷害',pko:t2.hp<=0?ti:null})}})}
  /* 排時間：開打後平均分配到約 10 秒內 */
  var acts=ev.length,gap=Math.max(160,Math.min(520,10000/Math.max(1,acts))),t=WALK+400;
  ev.forEach(function(e){e.t=t;t+=e.kind==='round'?gap*.5:gap;(e.dead||[]).forEach(function(i){mko[i]=e.t+260});if(e.pko!=null)pko[e.pko]=e.t+260});
