<style>
:root{color-scheme:dark;--bg:#120c08;--panel:#2b333e;--panel2:#3a4656;--line:#3a4654;--fg:#eadbbd;--dim:#aab5c4;--accent:#e0b84a;--red:#d4553f;--ok:#8fd478;

--cpB:polygon(0 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% 100%,6px 100%,6px calc(100% - 2px),4px calc(100% - 2px),4px calc(100% - 4px),2px calc(100% - 4px),2px calc(100% - 6px),0 calc(100% - 6px));
--cpC:polygon(0 4px,2px 4px,2px 2px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 6px),calc(100% - 2px) calc(100% - 6px),calc(100% - 2px) calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) calc(100% - 2px),calc(100% - 6px) calc(100% - 2px),calc(100% - 6px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px));

--rust:linear-gradient(rgba(150,70,25,.85),rgba(150,70,25,.85)) 2px 10px/2px 7px no-repeat,linear-gradient(rgba(120,55,20,.8),rgba(120,55,20,.8)) calc(100% - 16px) calc(100% - 4px)/9px 2px no-repeat,linear-gradient(rgba(150,70,25,.7),rgba(150,70,25,.7)) 14px 2px/6px 2px no-repeat;
--font:'Cubic 11','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#120c08 var(--wall,none);background-size:96px 48px;image-rendering:pixelated;color:var(--fg);font-family:var(--font);line-height:1.5}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 0,rgba(0,0,0,.55) 70%,rgba(0,0,0,.85) 100%)}

canvas{image-rendering:pixelated;display:block}
.grain{position:fixed;inset:0;pointer-events:none;z-index:0;background-size:480px 480px;image-rendering:pixelated;opacity:1}
button{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.px,.card,.sum,.pts,.temper,.opt,.btn,.chip,.stage,.ghost,.step button,.toast,.enslot{border:0;box-shadow:inset 0 0 0 2px var(--bd),inset 0 4px 0 0 var(--hi),inset 0 -4px 0 0 var(--lo);clip-path:var(--cpA)}

.card,.sum,.pts,.temper{background:var(--rivets),var(--rust),var(--wear) 0 0/288px 288px,linear-gradient(180deg,rgba(220,235,255,.07),rgba(0,0,0,.26)),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),var(--panel)}
.opt,.stage,.chip,.enslot{background:var(--wear) 0 0/288px 288px,linear-gradient(180deg,rgba(220,235,255,.07),rgba(0,0,0,.26)),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),var(--panel)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#1f262e;border-bottom:4px solid #06080b;box-shadow:inset 0 -3px 0 #5d6b7c,0 4px 0 rgba(0,0,0,.4)}

.main{flex:1;padding:16px 18px 100px;display:flex;flex-direction:column;gap:14px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.badge.warn{color:#d49a6a;box-shadow:inset 0 0 0 2px #7a4a2a}
.stat{font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums}
.stat span{color:var(--dim)}

.bar{height:8px;background:#06080b;margin-top:5px;box-shadow:inset 0 0 0 2px #3a4654;padding:2px}

.barcap{font-size:11px;color:var(--dim)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{--hi:#d49a52;--lo:#3d230d;background:#7a4f22;min-height:54px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:manipulation;text-shadow:1px 1px 0 #000}
.btn small{font-size:11px;font-weight:400;color:#f6dfae}

.btn:disabled small{color:#d08a6a}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.opt:focus-visible,.tab:focus-visible,.arr:focus-visible,.ghost:focus-visible,.step button:focus-visible{outline:2px solid #fff;outline-offset:3px}

.step button:disabled{background:#171c22;color:#556272;cursor:default}
.step .n{min-width:40px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tier{display:flex;flex-direction:column;gap:8px}
.tier.lock{opacity:.5}
.tierh{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);letter-spacing:.1em;text-shadow:1px 1px 0 #000}
.opt{padding:9px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}

.opt .d{font-size:12px;color:var(--dim)}
.opt[aria-pressed="true"]{--bd:#e0b84a;background-color:var(--panel2)}
.opt[aria-pressed="true"] .t{color:var(--accent)}
.opt:disabled{cursor:default}
.note{font-size:11px;color:var(--dim);margin:4px 0 0}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);background:#1f262e;border-top:4px solid #06080b;box-shadow:inset 0 3px 0 #5d6b7c;z-index:5}

.tab canvas{filter:saturate(.3) brightness(.62)}
.tab[aria-selected="true"]{color:var(--accent);background:#34404d;box-shadow:inset 0 3px 0 var(--accent)}
.tab[aria-selected="true"] canvas{filter:none}
.dot{position:absolute;top:8px;right:calc(50% - 26px);width:8px;height:8px;background:var(--red);box-shadow:0 0 0 2px #080503}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#120c08;--bd:#e0b84a;padding:6px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;white-space:nowrap}
.toast.on{opacity:1}

.enrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.enslot{position:relative;min-height:150px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;overflow:hidden}

.enslot .eic{background:#161b22;padding:4px;box-shadow:inset 0 0 0 2px #3a4654}
.enslot .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.25;min-height:2.5em;display:flex;align-items:center;text-shadow:1px 1px 0 #000}
.enslot.lock .lvt,.enslot.lock .eic,.enslot.lock .nm{opacity:.35}
.enslot.lock{cursor:default}
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:8px}
.sheet[hidden]{display:none}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.78)}
.scroll{position:relative;width:100%;max-width:380px;display:flex;flex-direction:column;filter:drop-shadow(5px 6px 0 rgba(0,0,0,.6));max-height:calc(100vh - 24px)}
.roller{position:relative;flex:0 0 auto;height:24px;margin:0 6px;z-index:2;box-shadow:inset 0 0 0 2px #1a0d05;
 background:linear-gradient(rgba(20,8,2,.5),rgba(20,8,2,.5)) 14% 8px/12px 5px no-repeat,linear-gradient(rgba(20,8,2,.5),rgba(20,8,2,.5)) 41% 14px/16px 4px no-repeat,linear-gradient(rgba(20,8,2,.55),rgba(20,8,2,.55)) 66% 6px/9px 6px no-repeat,linear-gradient(rgba(20,8,2,.5),rgba(20,8,2,.5)) 86% 13px/14px 5px no-repeat,linear-gradient(rgba(70,150,120,.75),rgba(70,150,120,.75)) 29% 3px/7px 3px no-repeat,linear-gradient(rgba(60,130,105,.7),rgba(60,130,105,.7)) 75% 16px/8px 3px no-repeat,var(--wearC) 0 0/288px 288px,linear-gradient(#f0b27a 0 3px,#c47a3e 3px 9px,#97562a 9px 16px,#4a2410 16px 100%)}
.roller::before,.roller::after{content:"";position:absolute;top:-4px;width:12px;height:32px;background:linear-gradient(rgba(20,8,2,.5),rgba(20,8,2,.5)) 3px 9px/5px 5px no-repeat,linear-gradient(rgba(70,150,120,.8),rgba(70,150,120,.8)) 6px 20px/4px 3px no-repeat,linear-gradient(90deg,#d99058 0 4px,#a8602f 4px 8px,#4a2410 8px 100%);box-shadow:inset 0 0 0 2px #1a0d05}
.roller::before{left:-10px}.roller::after{right:-10px}
.paper{position:relative;flex:1 1 auto;min-height:0;margin:0 8px;display:flex;color:#3b2713;overflow:hidden;animation:unroll .4s steps(8) both}
@keyframes unroll{from{max-height:0}to{max-height:calc(100vh - 80px)}}
@media (prefers-reduced-motion:reduce){.paper{animation:none}}
.edge{flex:0 0 24px;background-repeat:repeat-y;background-size:24px 192px;image-rendering:pixelated}
.edge.l{background-image:var(--edgeL)}
.edge.r{background-image:var(--edgeR)}
.pbody{flex:1;min-width:0;padding:16px 4px 18px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;
 background-color:#d3b480;background-image:linear-gradient(#3b2713 0 3px,#6e4a26 3px 6px,#a07b45 6px 8px,transparent 8px),linear-gradient(0deg,#3b2713 0 3px,#6e4a26 3px 6px,#a07b45 6px 8px,transparent 8px),var(--paperT);
 background-size:auto,auto,256px 256px;background-repeat:no-repeat,no-repeat,repeat;background-position:0 0,0 100%,0 0}
.phead{display:flex;align-items:center;gap:12px}

.sheetopts{display:flex;flex-direction:column;gap:12px}
.sopt{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px 14px 13px;cursor:pointer;border:0;background:rgba(120,80,30,.08);color:#3b2713;box-shadow:inset 0 0 0 6px rgba(90,55,20,.13)}
.sopt .hd{display:flex;align-items:center;gap:8px}

.sopt .t{font-size:14px;font-weight:700;color:#3b2713}
.sopt .d{font-size:12px;line-height:1.5;color:#5a3d1e}
.sopt.sel{background-color:rgba(255,240,200,.16);box-shadow:inset 0 0 0 6px var(--rcS),0 0 0 6px var(--rcB);animation:selglow 1.8s steps(3) infinite}
@keyframes selglow{0%,100%{box-shadow:inset 0 0 0 6px var(--rcS),0 0 0 6px var(--rcB)}50%{box-shadow:inset 0 0 0 6px var(--rc),0 0 0 6px var(--rcA)}}

.btn,.ghost,.step button{background-image:var(--wear),linear-gradient(180deg,rgba(255,230,180,.10),rgba(0,0,0,.22));background-size:288px 288px,auto}
.tab[aria-selected="true"],.sopt.sel{background-image:var(--wear);background-size:288px 288px}
/* brown wood keys (buttons, tabs, selectable slots) */
.chip,.enslot,.ghost,.step button,.seg,.tabs{--panel:#2b1d13;--panel2:#3a2616;--hi:#6b4a2a;--lo:#150c06;--bd:#080503;--dim:#b09a74}
.chip,.enslot{background:var(--wearB) 0 0/288px 288px,linear-gradient(180deg,rgba(255,220,160,.06),rgba(0,0,0,.24)),repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 12px),var(--panel)}
.chip[aria-selected="true"]{--bd:#e0b84a;background-color:var(--panel2)}
.chip.off{background-color:#1d140d;color:#7a6a50}
.ghost,.step button{background-color:#4a3018;background-image:var(--wearB),linear-gradient(180deg,rgba(255,230,180,.10),rgba(0,0,0,.22))}

.rd{position:absolute;top:5px;left:5px;width:9px;height:9px;background:#d4553f;box-shadow:0 0 0 2px #080503,inset -2px -2px 0 #8a2a20}
.rd.sd{left:auto;top:9px;right:calc(50% - 34px)}
.seg button{position:relative}
.enslot .eic,.sopt .eic{background:none!important;padding:0!important;box-shadow:none!important}
.rune{animation:runeglow 2.6s steps(6) infinite}
@keyframes runeglow{0%,100%{filter:brightness(.82)}50%{filter:brightness(1.3)}}

.sopt{padding:0;gap:0;cursor:default}

.sopt .pick:active:not([disabled]){transform:translateY(2px)}
.sopt .pick:focus-visible{outline:2px solid #4a2a12;outline-offset:-4px}
.sopt.used{opacity:1;background:rgba(60,40,20,.14)}
.sopt.used .pick,.sopt.used details{filter:grayscale(1) brightness(.85);opacity:.55}
.sopt.used .pick{cursor:not-allowed}
.sopt .tt{display:flex;flex-direction:column;min-width:0}
.sopt .sub{font-size:11px;color:#7a5a30;letter-spacing:.06em}
.sopt .usedb{position:absolute;top:8px;right:8px;font-size:11px;line-height:1.6;padding:0 6px;background:#8a2a20;color:#f0dfb8;box-shadow:0 0 0 2px #3b2713;transform:rotate(3deg)}
.sopt{overflow:hidden}

    res({name:d[1],img:im,frames:frames,fw:fw,fh:fh,dw:Math.round(fw/div),dh:Math.round(fh/div)})};im.onerror=function(){res(null)};im.src=BASE+'pets/'+d[0]+'.png?v='+V})}))}
function placePets(list){list.forEach(function(P,i){if(!P)return;var x,y;do{x=rnd(81,239);y=rnd(242,348)}while(inFire(x,y));
  var a={pet:P,p:{name:P.name},x:x,y:y,tx:x,ty:y,face:Math.random()<.5?-1:1,wait:rnd(.5,3),phase:rnd(0,4000)};
  var t=document.createElement('div');t.className='tag pet';var nm=document.createElement('span');nm.textContent=P.name;t.appendChild(nm);
  t.addEventListener('click',function(e){e.stopPropagation();openCard(a)});tagsEl.appendChild(t);a.tag=t;ACT.push(a)})}
/* tap on a character: pick the front-most body (largest feet y) whose body box holds the point */
document.getElementById('plaza').addEventListener('click',function(e){var r=scene.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*SW,py=(e.clientY-r.top)/r.height*SH,best=null;
  ACT.forEach(function(a){if(a.pet)return;if(Math.abs(px-a.x)<=10&&py>=a.y-42&&py<=a.y+2&&(!best||a.y>best.y))best=a});if(best)openCard(best)});
function initNames(){var cb=document.getElementById('showNames'),v=true;try{v=localStorage.getItem('camp.showNames')!=='0'}catch(e){}
  cb.checked=v;tagsEl.classList.toggle('hn',!v);
  cb.addEventListener('change',function(){tagsEl.classList.toggle('hn',!cb.checked);try{localStorage.setItem('camp.showNames',cb.checked?'1':'0')}catch(e){}})}
function start(me,others){ME_UID=me.uid;ME_P=me;initNames();NavIcons.setPlayer(me);var list=[me].concat(others.slice(0,9));
  document.getElementById('pcount').textContent='營地裡有 '+list.length+' 位冒險者';
  Party.init({demo:demo,base:BASE,v:V,me:function(){return ME_P},look:look,withFB:withFB,getCSV:getCSV,rawWeapons:function(){return RAWW},wbyname:WBYNAME,petinfo:PETINFO,toast:toast,
    findLocal:function(u){var r=null;ACT.forEach(function(a){if(!a.pet&&a.p.uid===u)r=a.p});return r},demoList:function(){return window.__DL||[]}});
  scene.width=SW;scene.height=SH;buildBG();placeAll(list);placePets(PETLIST);document.getElementById('loading').remove();renderTabs();requestAnimationFrame(tick)}

var V2='1';var FRONT=new Image();FRONT.src=BASE+'camp/camp_front.png?v='+Date.now();
var SCENE=new Image();SCENE.src=BASE+'camp/camp_cut.png?v='+Date.now();
buildBG=function(){var c=document.createElement('canvas');c.width=SW;c.height=SH;var x=c.getContext('2d');
  for(var y=0;y<SH;y++){var k=Math.min(1,y/191);x.fillStyle='rgb('+(11+k*14|0)+','+(20+k*20|0)+','+(38+k*30|0)+')';x.fillRect(0,y,SW,1)}
  var sd=5;function r(){sd=(sd*9301+49297)%233280;return sd/233280}
  STARS=[];for(var i=0;i<60;i++)STARS.push({x:Math.floor(r()*SW/2)*2,y:Math.floor(r()*143/2)*2,big:r()<.18,ph:r()*6.28,sp:.8+r()*1.6,col:r()<.3?'#ffe9b0':'#c9d4ff'});
  for(var yy=-8;yy<=8;yy++)for(var xx=-8;xx<=8;xx++){var d=Math.hypot(xx,yy),d2=Math.hypot(xx-3.5,yy-1);if(d<7.5&&d2>6.6){x.fillStyle=d<5.8?'#fff2c8':'#e6d3a0';x.fillRect(230+xx,29+yy,1,1)}}
  BG=c};
var LAMPS=[[115.1, 198.9], [77.4, 230.2], [34.0, 255.8], [269.1, 209.4]];
function lamps2(now){LAMPS.forEach(function(p,i){var fl=.85+.1*Math.sin(now/700+i*1.7)+.05*Math.sin(now/290+i),R2=20;
  var g=sx.createRadialGradient(p[0],p[1],0,p[0],p[1],R2);g.addColorStop(0,'rgba(255,236,170,'+(.5*fl)+')');g.addColorStop(.35,'rgba(255,214,130,'+(.19*fl)+')');g.addColorStop(1,'rgba(255,200,110,0)');
  sx.fillStyle=g;sx.fillRect(p[0]-R2,p[1]-R2,R2*2,R2*2)})}
fire=function(now){var f=Math.floor(now/130)%6,cx0=FIRE.x,by0=FIRE.y-2;sx.save();sx.translate(cx0,by0);sx.scale(1.4,1.4);var cx=0,by=0;
  R('#ffb040',cx-4,by-2,8,1);R('#ff7a2a',cx-6,by-1,12,1);R('#c2401c',cx-5,by,10,1);
  var T=[[-6,6,0],[-3,10,1],[0,13,2],[3,9,3],[6,6,4],[-1,8,5],[2,11,0]];
  T.forEach(function(t){var ph=(f+t[2])%6,h=t[1]+[0,1,2,1,0,-1][ph],x=cx+t[0]+[0,1,0,-1,0,1][ph],w=t[1]>9?4:3;
    for(var y=0;y<h;y++){var k=y/h,ww=Math.max(1,Math.round(w*(1-k*k))),xx=x-Math.floor(ww/2)+Math.round(Math.sin((y+ph*2)*.7)*k*1.5);R(k<.35?'#ffd35a':k<.7?'#ff8a2a':'#d8401c',xx,by-3-y,ww,1)}});
  var ch=6+[0,1,1,0,0,-1][f];for(var y=0;y<ch;y++){var ww=Math.max(1,Math.round(3*(1-y/ch)));R(y<ch*.5?'#fff6c8':'#ffe07a',cx-Math.floor(ww/2),by-3-y,ww,1)}sx.restore()};
var demo=/[?&]demo=1/.test(location.search);
window.addEventListener('pagehide',function(){STOP=true});window.addEventListener('pageshow',function(e){if(e.persisted&&STOP){STOP=false;last=0;requestAnimationFrame(tick)}});
Promise.all(['weapon_info.csv','rune_info.csv','weapon_rune.csv','pet_info.csv'].map(getCSV)).then(function(R){RAWW=R[0];R[3].forEach(function(r){if(!r.pet_id)return;var c=[];for(var i=1;i<=10;i++)c.push(parseInt(r['cost_lv'+i],10)||1);PETINFO[r.pet_id]={id:r.pet_id,name:r.pet_name,trait:r.trait_name,stat:r.bonus_stat,perTxt:String(r.bonus_per_level||'').trim(),per:(parseFloat(r.bonus_per_level)||0)/100,max:parseInt(r.max_level,10)||10,cost:c}});return buildData(R.slice(0,3))}).then(function(){ORDER.forEach(function(k){WBYNAME[W[k].n]=k});return Promise.all([Doll.load(BASE,V),loadPets().then(function(l){PETLIST=l})])}).then(function(){
  if(demo){var d=demoPlayers();window.__DL=d;d.forEach(function(q,i){q.lv=5+i*3;q.jobLv={['job0'+(q.job+1)]:2+i};q.alloc={str:i,int:2,agi:i%3,vit:3,luk:1}});d[0].party=['d1','d2','d3'];d[0].leaders=['d6'];d[2].party=['d1','d4','d7'];d[3].leaders=['d1','d2'];d[0].cookies=4;d[0].pets={gm_pet_02:{lv:3},gm_pet_01:{lv:1}};start(d[0],d.slice(1));return}
  return new Promise(function(res){withFB(function(FB){FB.requirePlayer('../').then(function(who){return FB.listPlayers(30).then(function(all){
    var me=Object.assign({uid:who.user.uid},who.player,{lastSeen:Date.now()});
    start(me,all.filter(function(p){return p.uid!==me.uid&&!p.disabled}));res()})})})})
}).catch(function(e){var m=document.getElementById('loading');m.textContent='資料載入失敗：'+(e.code||e.message);m.classList.add('err')});
})();
