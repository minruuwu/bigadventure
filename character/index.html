<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色</title>
<link rel="stylesheet" href="../common/font.css?v=1">
<style>
:root{color-scheme:dark;--bg:#120c08;--fg:#eadbbd;--dim:#b09a74;--accent:#e0b84a;--red:#d4553f;
  --panel:#2b1d13;--panel2:#3a2616;--hi:#6b4a2a;--lo:#080503;--ink:#f0e2c4;--gold:#ffd98a;
  --paper:#e3d3aa;--paper2:#d3bf8f;--pink:#3a2616;--pink2:#6b4a2a;--seal:#9a3a2a;--ok:#4f7a3a;
  --font:'Cubic 11','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#120c08;color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;font-weight:500}
button{font-family:inherit}
canvas{image-rendering:pixelated;display:block}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#1f262e;border-bottom:4px solid #06080b;box-shadow:inset 0 -3px 0 #5d6b7c,0 4px 0 rgba(0,0,0,.4)}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.3em;text-shadow:2px 2px 0 #000}
.main{flex:1;padding:0 0 92px;display:flex;flex-direction:column;gap:10px}
.note{font-size:11px;color:var(--dim);margin:0 18px}
#loading{position:fixed;left:12px;right:12px;top:40%;z-index:99;text-align:center;font-size:14px;color:var(--dim)}
#loading.err{top:12px;padding:8px;background:#000;color:#ff9a8a;text-align:left}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);background:#2a1b0f;border-top:4px solid #080503;box-shadow:inset 0 3px 0 #6b4a2a;z-index:5}
.tab{position:relative;background:none;border:0;color:var(--dim);font-size:12px;font-weight:700;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:68px;text-shadow:1px 1px 0 #000}
.tab canvas{filter:saturate(.3) brightness(.62)}
.tab[aria-selected="true"]{color:var(--accent);background:#3d2814;box-shadow:inset 0 3px 0 var(--accent)}
.tab[aria-selected="true"] canvas{filter:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#120c08;box-shadow:0 0 0 2px #e0b84a;padding:6px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:92vw}
.toast.on{opacity:1}

/* ===== night tent room (92 x 120 art pixels, shown scaled) ===== */
.room{position:relative;width:100%;aspect-ratio:92/120;background:#0c0705;overflow:hidden;container-type:inline-size}
.room canvas{position:absolute;display:block;image-rendering:pixelated}
#bg,#fg{left:0;top:0;width:100%;height:100%}
#doll{left:23.913%;top:28.333%;width:52.174%;height:40%}
.light{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse 62% 46% at 50% 21%,rgba(255,184,96,.42),transparent 74%);animation:flick 3.3s ease-in-out infinite}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 48%,transparent 55%,rgba(0,0,0,.5))}
@keyframes flick{0%,100%{opacity:.78}35%{opacity:1}60%{opacity:.86}80%{opacity:.97}}
@media (prefers-reduced-motion:reduce){.light{animation:none}}
.hs{position:absolute;background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit}
.hs:hover,.hs:focus-visible{outline:2px dashed var(--gold);outline-offset:2px;background:rgba(255,217,138,.10)}
.pill{position:absolute;transform:translate(-50%,-50%);font-size:clamp(10px,2.9cqw,12px);padding:1px 7px;color:var(--ink);background:rgba(8,5,3,.82);border:1px solid #000;box-shadow:inset 0 1px 0 var(--hi);pointer-events:none;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;background:#e0482f;border:1px solid #000;margin-left:5px;vertical-align:1px}
.card{position:absolute;left:39.13%;top:82.2%;width:34.78%;height:14.5%;color:#3a2616;pointer-events:none;display:flex;flex-direction:column;justify-content:center;gap:1px;line-height:1.25}
.card b{font-size:clamp(11px,3.4cqw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:clamp(10px,3cqw,13px)}

/* ===== parchment sheets ===== */
.back{position:fixed;inset:0;z-index:50;background:rgba(8,5,3,.72);display:flex;align-items:center;justify-content:center;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.back[hidden]{display:none}
.swo{width:min(100%,460px);max-height:100%;display:flex;filter:drop-shadow(3px 0 0 #3b2713) drop-shadow(-3px 0 0 #3b2713) drop-shadow(0 3px 0 #3b2713) drop-shadow(0 -3px 0 #3b2713) drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.sw{position:relative;flex:1;min-width:0;max-height:100%;display:flex}
.sw .edge{position:absolute;top:0;bottom:0;width:30px;z-index:3;pointer-events:none;background-size:30px 192px;background-repeat:repeat-y;image-rendering:pixelated}
.sw .edge.l{left:0;background-image:var(--edgeL2)}.sw .edge.r{right:0;background-image:var(--edgeR2)}
.sw .edge.t,.sw .edge.b{left:0;right:0;width:auto;height:30px;background-size:192px 30px;background-repeat:repeat-x}
.sw .edge.t{top:0;bottom:auto;background-image:var(--edgeT2)}.sw .edge.b{top:auto;bottom:0;background-image:var(--edgeB2)}
.sheet{position:relative;flex:1;min-width:0;min-height:0;overflow:auto;color:var(--pink);margin:0 6px;padding:40px 28px 36px;
 background-color:#d3b480;background-image:var(--paperT);background-size:256px 256px;
 background-repeat:repeat;background-position:0 0}
.sheet h2{margin:0 0 2px;font-size:18px;letter-spacing:.06em}
.sheet .hint{margin:0 0 12px;font-size:12px;color:var(--pink2)}
.sheet .x{position:absolute;right:34px;top:30px;z-index:6;width:30px;height:30px;padding:0;border:0;cursor:pointer;background:#4a2a12;color:#f0dfb8;font:inherit;font-size:16px;font-weight:700;line-height:30px;box-shadow:0 0 0 2px #1d1008,inset 0 2px 0 #7a5a30,inset 0 -2px 0 #2a1608}
.sheet .x:active{transform:translateY(2px)}
.sheet button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.sec{font-size:12px;letter-spacing:.08em;color:var(--pink2);margin:14px 0 6px;border-bottom:1px dashed var(--pink2);padding-bottom:2px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(58,38,22,.18)}
.row .nm{background:none;border:0;font:inherit;text-align:left;color:var(--pink);cursor:pointer;padding:0;display:flex;gap:8px;align-items:baseline}
.row .nm small{color:var(--pink2);font-size:11px}
.row .v{font-variant-numeric:tabular-nums;font-weight:700}
.row .src{grid-column:1/-1;font-size:12px;color:var(--pink2);padding:2px 0 2px 10px;border-left:3px solid var(--pink2)}
.row .src div+div{margin-top:1px}
.step{display:flex;align-items:center;gap:6px}
.step button,.b{white-space:nowrap;font:inherit;font-size:13px;color:#f0e2c4;background:var(--pink);border:2px solid var(--lo);padding:2px 10px;cursor:pointer;min-width:30px}
.step button:disabled,.b:disabled{opacity:.4;cursor:default}
.b.alt{background:var(--paper2);color:var(--pink)}
.b.go{background:var(--seal)}
.bar{position:sticky;bottom:-36px;margin:14px -28px -36px;padding:10px 28px calc(80px + env(safe-area-inset-bottom,0px));background:#cdb27a;border-top:2px dashed var(--pink2);display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bar .t{margin-right:auto;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;color:var(--pink);background:var(--paper2);border:2px solid var(--lo);padding:3px 9px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pink);color:#f0e2c4}
.chip:disabled{opacity:.55;cursor:default}
.slot{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;margin-bottom:6px;background:var(--paper2);border:2px dashed var(--pink2);color:var(--pink2)}
.meter{height:8px;background:var(--paper2);border:2px solid var(--lo);margin-top:3px}
.meter i{display:block;height:100%;background:var(--seal)}
input.nm-in{font:inherit;color:var(--pink);background:var(--paper2);border:2px solid var(--lo);padding:4px 8px;min-width:0;width:100%}
.msgline{font-size:12px;min-height:1.4em;color:var(--seal)}
.sheet.m{padding-top:30px}
.ic{width:16px;height:16px;flex:none;image-rendering:pixelated;display:inline-block;vertical-align:-3px;margin-right:6px}
.dl{color:var(--ok);margin-left:6px;font-variant-numeric:tabular-nums}
.ask{flex:1 1 100%;font-size:12px;color:var(--seal)}
.mirror-wrap{position:sticky;top:0;z-index:4;margin:0 -28px 12px;padding:18px 0 14px;display:flex;justify-content:center;border-bottom:3px solid var(--lo);background:radial-gradient(ellipse 70% 60% at 50% 45%,#3a2616 0,#1c120b 75%)}
.mbox{position:relative;width:240px;height:280px}
.mbox canvas{position:absolute;image-rendering:pixelated}
#mframe{left:0;top:0;width:240px;height:280px}
#mdoll{left:24px;top:52px;width:192px;height:192px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fields label{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:12px;color:var(--pink2);letter-spacing:.06em}
select.sel{font:inherit;font-size:13px;width:100%;min-width:0;color:var(--pink);background:var(--paper2);border:2px solid var(--lo);padding:7px 6px}
select.sel.bad{color:var(--seal);border-color:var(--seal)}
.tag{color:var(--seal);font-size:11px;margin-left:6px}
.tag[hidden]{display:none}
.jobrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(58,38,22,.18)}
.jobrow small{grid-column:1/-1;color:var(--pink2);font-size:11px}
</style></head>
<body>
<div id="loading">讀取資料中…</div>
<div class="app">
  <div class="top"><h1>角色</h1></div>
  <main class="main">
    <section class="room" id="room" aria-label="角色頁">
      <canvas id="bg" width="92" height="120"></canvas>
      <canvas id="doll" width="48" height="48"></canvas>
      <canvas id="fg" width="92" height="120"></canvas>
      <div class="light"></div><div class="vig"></div>
      <div id="hsHost" style="display:contents"></div>
      <div class="card" id="cardText"></div>
    </section>
    <p class="note" id="demoNote" hidden>示範模式：用範例資料，改了不會存檔。</p>
  </main>
  <nav class="tabs" id="tabs" role="tablist" aria-label="主分頁"></nav>
  <div class="toast" id="toast"></div>
</div>
<div class="back" id="back" hidden><div class="swo"><div class="sw" id="sw"><i class="edge l"></i><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div><i class="edge r"></i><i class="edge t"></i><i class="edge b"></i></div></div></div>
<script src="../common/paper.js?v=5"></script>
<script src="../common/doll.js?v=9"></script>
<script src="../common/nav.js?v=14"></script>
<script>
(function(){
var OUT='#241610';
var OUT='#241610';
var C={steel:'#c6ced8',steelM:'#8d98a8',steelD:'#59627a',wood:'#a06f3c',woodD:'#6b4423',canvas:'#e6d3a8',canvasD:'#c4a874',red:'#c0463a',redD:'#8a2a20',gold:'#e0b84a',goldD:'#a87a22',par:'#eadbbd',ink:'#5a3a20',hot:'#f08a3a',skin:'#e2b48a',blue:'#4f8fd8',blueD:'#2f5d9a',green:'#5fae52',dark:'#3a2414'};
function make(draw,N,noOut){N=N||14;var g=[];for(var y=0;y<N;y++){g[y]=[];}
  function set(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<N&&y<N)g[y][x]=c}
  var api={
    rect:function(x0,y0,x1,y1,c){for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++)set(x,y,c)},
    poly:function(p,c){for(var y=0;y<N;y++)for(var x=0;x<N;x++){var px=x+.5,py=y+.5,ins=false;
      for(var i=0,j=p.length-1;i<p.length;j=i++){var xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))ins=!ins}
      if(ins)g[y][x]=c}},
    disc:function(cx,cy,r,c){for(var y=0;y<N;y++)for(var x=0;x<N;x++){var dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy<=r*r)g[y][x]=c}},
    line:function(x0,y0,x1,y1,c){var n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2);for(var i=0;i<=n;i++){var t=i/n;set(x0+(x1-x0)*t,y0+(y1-y0)*t,c)}},
    px:function(x,y,c){set(x,y,c)},
    clr:function(cx,cy,r){for(var y=0;y<N;y++)for(var x=0;x<N;x++){var dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy<=r*r)g[y][x]=undefined}}
  };
  draw(api);
  var cv=document.createElement('canvas');cv.width=cv.height=N+2;var x=cv.getContext('2d');
  for(var yy=-1;yy<=N;yy++)for(var xx=-1;xx<=N;xx++){var c=g[yy]&&g[yy][xx];
    if(c){x.fillStyle=c;x.fillRect(xx+1,yy+1,1,1)}
    else{var nb=[[1,0],[-1,0],[0,1],[0,-1]].some(function(d){var q=g[yy+d[1]]&&g[yy+d[1]][xx+d[0]];return q});
      if(nb&&!noOut){x.fillStyle=OUT;x.fillRect(xx+1,yy+1,1,1)}}}
  return cv}
var ICON={
 camp:{n:'帳篷',draw:function(a){
   a.poly([[7,.5],[14,14],[0,14]],C.canvas);a.poly([[7,.5],[14,14],[7,14]],C.canvasD);
   a.poly([[7,5.5],[10.5,14],[3.5,14]],C.dark);a.poly([[7,5.5],[7,14],[3.5,14]],C.woodD);
   a.rect(0,12,13,12,C.redD);a.px(7,0,C.wood);a.px(8,0,C.red);a.px(9,0,C.red)}},
 forge:{n:'錘與鐵砧',draw:function(a){
   a.rect(5,2,13,3,C.wood);a.rect(5,3,13,3,C.woodD);a.rect(0,0,5,5,C.steel);a.rect(0,3,5,5,C.steelM);a.rect(0,0,5,0,'#e8eef5');a.rect(0,0,0,5,C.steelD);
   a.rect(6,5,10,5,C.hot);
   a.rect(2,6,12,7,C.steel);a.rect(2,7,12,7,C.steelM);a.poly([[2,6],[0,7],[2,8]],C.steelM);
   a.rect(5,8,9,10,C.steelM);a.rect(3,11,11,13,C.steelD);a.rect(3,11,11,11,C.steelM)}},
 compass:{n:'羅盤',draw:function(a){
   a.disc(7,7,6.8,C.goldD);a.disc(7,7,5.6,C.par);
   a.poly([[7,1.6],[8.8,7],[5.2,7]],C.red);a.poly([[7,12.4],[8.8,7],[5.2,7]],C.steelM);
   a.px(1,6,C.ink);a.px(1,7,C.ink);a.px(12,6,C.ink);a.px(12,7,C.ink);a.rect(6,6,7,7,C.ink)}},
 map:{n:'摺疊地圖',draw:function(a){
   a.poly([[0.5,3],[4.5,2],[4.5,12],[0.5,13]],'#d8c18c');a.poly([[4.5,2],[9,3],[9,13],[4.5,12]],'#f0e0b8');a.poly([[9,3],[13.5,2],[13.5,12],[9,13]],'#cdb27a');
   a.line(4.5,2,4.5,12,'#8a6a3a');a.line(9,3,9,13,'#8a6a3a');
   a.px(2,6,C.green);a.px(2,7,C.green);a.px(3,7,C.green);
   a.px(6,4,C.blue);a.px(7,5,C.blue);a.px(6,7,C.blue);a.px(7,9,C.blue);
   a.line(5.5,6,8,9,C.red);a.line(8,6,5.5,9,C.red);
   a.px(11,5,C.ink);a.px(12,8,C.ink);a.px(11,10,C.ink)}},
 banner:{n:'旗幟',draw:function(a){
   a.rect(2,0,2,13,C.wood);a.px(2,0,C.gold);
   a.poly([[3,1.5],[12.5,1.5],[12.5,9.5],[8,7.5],[3,9.5]],C.red);a.poly([[3,1.5],[12.5,1.5],[12.5,3],[3,3]],C.redD);
   a.rect(1,13,4,13,C.woodD)}},
 trio:{n:'三人頭像',draw:function(a){
   a.rect(0,9,5,13,C.blueD);a.disc(2.8,6,2.2,C.skin);a.rect(1,3.6,4,4.4,'#6b4423');
   a.rect(8,9,13,13,C.green);a.disc(10.8,6,2.2,C.skin);a.rect(9,3.6,12,4.4,C.gold);
   a.rect(3,9,10,13,C.red);a.disc(6.5,4.6,2.8,C.skin);a.rect(3.8,1.6,9,3.2,'#3a2414');a.px(5,5,C.ink);a.px(8,5,C.ink)}},
 shield:{n:'盾牌',draw:function(a){
   a.poly([[1,0.8],[13,0.8],[13,7],[7,13.6],[1,7]],C.steelM);a.poly([[2.2,2],[11.8,2],[11.8,6.6],[7,11.6],[2.2,6.6]],C.red);
   a.rect(6,2,7,10,C.gold);a.rect(2,5,11,5,C.gold)}},
 scroll:{n:'羊皮紙卷',draw:function(a){
   a.rect(2,2,11,11,C.par);a.rect(2,2,2,11,'#d6c294');
   a.rect(0,0,13,2,C.canvasD);a.rect(0,1,13,1,C.canvas);a.rect(0,11,13,13,C.canvasD);a.rect(0,12,13,12,C.canvas);
   a.rect(4,4,9,4,C.ink);a.rect(4,6,10,6,C.ink);a.rect(4,8,8,8,C.ink)}},
 gear:{n:'齒輪',draw:function(a){
   a.disc(7,7,4.6,C.steelM);
   for(var k=0;k<8;k++){var t=k/8*Math.PI*2,cx=7+Math.cos(t)*5.6,cy=7+Math.sin(t)*5.6;a.rect(Math.round(cx-1.5),Math.round(cy-1.5),Math.round(cx-1.5)+2,Math.round(cy-1.5)+2,C.steel)}
   a.disc(7,7,4.4,C.steel);a.disc(7,7,1.9,'#2b1d12');a.rect(5,9,9,10,C.steelM);a.disc(7,7,1.9,'#2b1d12')}}
};

var P={ink:'#241610'};
/* ---------- stage tint (used for particles / glow) ---------- */
var TIER=[
 {pre:'鍛鐵',blade:'#aab2bc',edge:'#dfe5ec',dark:'#6b7482',acc:'#8a6a3a',hand:'#6b4423',gem:null},
 {pre:'精鋼',blade:'#9fb7d6',edge:'#e3f0ff',dark:'#5a7396',acc:'#4f8fd8',hand:'#5a3a22',gem:'#4f8fd8'},
 {pre:'黃金',blade:'#f0cd62',edge:'#fff3b8',dark:'#b58a22',acc:'#d4553f',hand:'#7a3a22',gem:'#d4553f'},
 {pre:'傳說',blade:'#e7d8ff',edge:'#ffffff',dark:'#8a62d0',acc:'#ff6a8a',hand:'#4a2a5a',gem:'#ff6a8a'}
];
function cv(src,scale){var c=document.createElement('canvas');c.width=src.width;c.height=src.height;c.getContext('2d').drawImage(src,0,0);c.style.width=src.width*scale+'px';c.style.height=src.height*scale+'px';return c}
function parseCSV(t){t=t.replace(/^﻿/,'');var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){var c=t.charAt(i);
    if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t.charAt(i+1)==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  var head=rows.shift().map(function(h){return h.trim()});
