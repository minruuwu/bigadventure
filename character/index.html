<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色</title>
<style>
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
:root{color-scheme:dark;--bg:#120c08;--fg:#eadbbd;--dim:#b09a74;--accent:#e0b84a;--red:#d4553f;
  --panel:#2b1d13;--panel2:#3a2616;--hi:#6b4a2a;--lo:#080503;--ink:#f0e2c4;--gold:#ffd98a;
  --paper:#e3d3aa;--paper2:#d3bf8f;--pink:#3a2616;--pink2:#6b4a2a;--seal:#9a3a2a;--ok:#4f7a3a;
  --font:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#120c08 var(--wall,none);background-size:96px 48px;image-rendering:pixelated;color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;font-weight:500}
button{font-family:inherit}
canvas{image-rendering:pixelated;display:block}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#1f262e;border-bottom:4px solid #06080b;box-shadow:inset 0 -3px 0 #5d6b7c,0 4px 0 rgba(0,0,0,.4)}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.3em;text-shadow:2px 2px 0 #000}
.main{flex:1;padding:16px 18px 92px;display:flex;flex-direction:column;gap:10px}
.note{font-size:11px;color:var(--dim);margin:0 18px}
#loading{position:fixed;left:12px;right:12px;top:40%;z-index:99;text-align:center;font-size:14px;color:var(--dim)}
#loading.err{top:12px;padding:8px;background:#000;color:#ff9a8a;text-align:left}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);background:#2a1b0f;border-top:4px solid #080503;box-shadow:inset 0 3px 0 #6b4a2a;z-index:5}
.tab{position:relative;background:none;border:0;color:var(--dim);font-size:12px;font-weight:700;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:68px;text-shadow:1px 1px 0 #000}
.tab canvas{filter:saturate(.3) brightness(.62)}
.tab[aria-selected="true"]{color:var(--accent);background:#3d2814;box-shadow:inset 0 3px 0 var(--accent)}
.tab[aria-selected="true"] canvas{filter:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#120c08;box-shadow:0 0 0 2px #e0b84a;padding:6px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:92vw}
.toast.on{opacity:1}

/* ===== tent room (130 x 112 art pixels, shown scaled) ===== */
.grain{position:fixed;inset:0;pointer-events:none;z-index:-1;background-size:480px 480px;image-rendering:pixelated}
.room{isolation:isolate;position:relative;width:100%;aspect-ratio:130/140;background:#0c0705;overflow:hidden;container-type:inline-size}
.room canvas{position:absolute;display:block;image-rendering:pixelated}
#bgimg,#tbl{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}
#tbl{z-index:5;pointer-events:none}
#room .tp{position:absolute;z-index:6;pointer-events:none;image-rendering:pixelated;transform-origin:50% 100%;display:block}

#doll{left:18.31%;top:21.29%;width:48%;height:44.57%;z-index:3}
.glow{position:absolute;left:77.23%;top:36.64%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:1;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(205,140,255,.85) 0,rgba(160,90,235,.45) 22%,rgba(120,60,200,.18) 48%,rgba(100,50,180,0) 70%);animation:glowbr 3.2s ease-in-out infinite}
@keyframes glowbr{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}
.hs{position:absolute;z-index:6;background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit}
.hs:hover,.hs:focus-visible{outline:2px dashed var(--gold);outline-offset:2px;background:rgba(255,217,138,.10)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px}
.nmchk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;text-shadow:1px 1px 0 #000;cursor:pointer;user-select:none}
.nmchk input{position:absolute;opacity:0;width:1px;height:1px}
.nmchk .bx{width:16px;height:16px;background:#2b1d13;box-shadow:0 0 0 2px #080503,inset 0 0 0 2px #6b4a2a;display:inline-flex;align-items:center;justify-content:center;color:#ffd76a;font-size:13px;line-height:1}
.nmchk input:checked+.bx::after{content:'✓'}
.nmchk input:focus-visible+.bx{outline:2px solid #fff;outline-offset:2px}
.room.hn .pill{display:none}
.pill{position:absolute;z-index:200;transform:translate(-50%,-100%);font-size:clamp(10px,3.1cqw,13px);font-weight:700;padding:1px 6px;color:var(--ink);background:rgba(40,22,8,.88);box-shadow:0 0 0 1px #b9823f;cursor:pointer;white-space:nowrap}
.pill.dn{transform:translate(-50%,0)}
.dot{display:inline-block;width:7px;height:7px;background:#e0482f;border:1px solid #000;margin-left:5px;vertical-align:1px}
.card{margin:0 18px;text-align:center;color:var(--fg);display:flex;flex-direction:column;gap:1px;line-height:1.3}
.card b{font-size:19px;font-weight:900;-webkit-text-stroke:.9px currentColor;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c1,.card .c2{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.card .c2{gap:6px}.card .c2 .ji{width:28px;height:28px;margin:0}.card .c1 b:first-child{min-width:0}
.card .c2 .jl{color:var(--dim)}
.acts5{display:flex;gap:4px;margin:0 18px}
.acts5 button{flex:1;min-width:0;font:inherit;font-weight:900;font-size:13px;white-space:nowrap;padding:11px 0;color:#f0e2c4;background:rgba(61,35,13,.9);border:0;cursor:pointer;box-shadow:inset 0 0 0 2px #1d1008,inset 0 2px 0 2px #b9823f;text-shadow:1px 1px 0 #000}
.acts5 button:active{filter:brightness(.9)}

/* ===== parchment sheets ===== */
.back{position:fixed;inset:0;z-index:50;background:rgba(8,5,3,.72);display:flex;align-items:center;justify-content:center;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.back[hidden]{display:none}.back{overscroll-behavior:contain}.sheet{overscroll-behavior:contain}html:has(.back:not([hidden])),html:has(.back:not([hidden])) body{overflow:hidden;overscroll-behavior:none}
.swo{width:min(100%,460px);max-height:100%;display:flex;filter:drop-shadow(3px 0 0 #3b2713) drop-shadow(-3px 0 0 #3b2713) drop-shadow(0 3px 0 #3b2713) drop-shadow(0 -3px 0 #3b2713) drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.sw{position:relative;flex:1;min-width:0;max-height:100%;display:flex}
.sw .edge{position:absolute;top:0;bottom:0;width:30px;z-index:3;pointer-events:none;background-size:30px 192px;background-repeat:repeat-y;image-rendering:pixelated}
.sw .edge.l{left:0;background-image:var(--edgeL2)}.sw .edge.r{right:0;background-image:var(--edgeR2)}
.sw .edge.t,.sw .edge.b{left:0;right:0;width:auto;height:30px;background-size:192px 30px;background-repeat:repeat-x}
.sw .edge.t{top:0;bottom:auto;background-image:var(--edgeT2)}.sw .edge.b{top:auto;bottom:0;background-image:var(--edgeB2)}
.sheet{position:relative;flex:1;min-width:0;min-height:0;overflow:auto;color:var(--pink);margin:0 6px;padding:40px 28px 36px;
 background-color:#d3b480;background-image:var(--paperT);background-size:256px 256px;
 background-repeat:repeat;background-position:0 0}
.sheet h2{margin:0 0 2px;font-size:18px;letter-spacing:.06em}
.sheet .hint{margin:0 0 12px;font-size:12px;color:var(--pink2)}
.sheet .x{position:absolute;right:34px;top:30px;z-index:6;width:30px;height:30px;padding:0;border:0;cursor:pointer;background:#4a2a12;color:#f0dfb8;font:inherit;font-size:16px;font-weight:700;line-height:30px;box-shadow:0 0 0 2px #1d1008,inset 0 2px 0 #7a5a30,inset 0 -2px 0 #2a1608}
.sheet .x:active{transform:translateY(2px)}
.sheet button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.sec{font-size:12px;letter-spacing:.08em;color:var(--pink2);margin:14px 0 6px;border-bottom:1px dashed var(--pink2);padding-bottom:2px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(58,38,22,.18)}
.row .nm{background:none;border:0;font:inherit;text-align:left;color:var(--pink);cursor:pointer;padding:0;display:flex;gap:8px;align-items:baseline}
.row .nm small{color:var(--pink2);font-size:11px}
.row .v{font-variant-numeric:tabular-nums;font-weight:700}
.row .src{grid-column:1/-1;font-size:12px;color:var(--pink2);padding:2px 0 2px 10px;border-left:3px solid var(--pink2)}
.row .src div+div{margin-top:1px}
.step{display:flex;align-items:center;gap:6px}
.step button,.b{white-space:nowrap;font:inherit;font-size:13px;color:#f0e2c4;background:var(--pink);border:2px solid var(--lo);padding:2px 10px;cursor:pointer;min-width:30px}
.step button:disabled,.b:disabled{opacity:.4;cursor:default}
.b.alt{background:var(--paper2);color:var(--pink)}
.b.go{background:var(--seal)}
.sheet .sth{position:sticky;top:-40px;z-index:2;border-bottom:1px dashed rgba(107,74,42,.35);margin:-40px -28px 6px;padding:30px 70px 6px 28px;min-height:66px;box-sizing:border-box;background-color:#d3b480;background-image:var(--paperT);background-size:256px 256px;border-bottom:1px dashed rgba(107,74,42,.35)}
.sheet .sth .bk{margin-bottom:2px;display:block}.sheet .sth h2{margin:0}.sheet .sth .x{top:30px}
.bar{position:sticky;bottom:-36px;margin:14px -28px -36px;padding:10px 28px calc(80px + env(safe-area-inset-bottom,0px));background:#cdb27a;border-top:2px dashed var(--pink2);display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bar .t{margin-right:auto;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;color:var(--pink);background:var(--paper2);border:2px solid var(--lo);padding:3px 9px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pink);color:#f0e2c4}
.chip:disabled{opacity:.55;cursor:default}
.slot.lk{opacity:.55}.slot{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;margin-bottom:6px;background:var(--paper2);border:2px dashed var(--pink2);color:var(--pink2)}
.meter{height:8px;background:var(--paper2);border:2px solid var(--lo);margin-top:3px}
.meter i{display:block;height:100%;background:var(--seal)}
input.nm-in{font:inherit;color:var(--pink);background:var(--paper2);border:2px solid var(--lo);padding:4px 8px;min-width:0;width:100%}
.msgline{font-size:12px;min-height:1.4em;color:var(--seal)}
.ic{width:32px;height:32px;flex:none;image-rendering:pixelated;display:inline-block;margin:0 4px 0 0}.row .nm,.grid2 .row>span:first-child{display:inline-flex;align-items:center}.row .nm small{margin-left:8px}.grid2 .ic{width:24px;height:24px}
.dl{color:var(--ok);margin-left:6px;font-variant-numeric:tabular-nums}
.ask{flex:1 1 100%;font-size:12px;color:var(--seal)}
/* ===== mirror popup (bricks + pixel light) ===== */
.back.mir{bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-bottom:8px}
.back.mir .swo{filter:none;width:min(100%,440px)}
.back.mir .sw .edge{display:none}
.back.mir .sw{box-shadow:0 0 0 3px #080503,0 0 0 5px #7a5a30,0 6px 24px rgba(0,0,0,.7)}
.back.mir .sheet{margin:0;padding:0;background:none!important;color:#eadbbd}
.mwrap{position:relative;padding:8px 8px 12px;background:var(--grain,none) 0 0/480px 480px,var(--wall,none) 0 0/96px 48px,#120c08;image-rendering:pixelated;overflow:hidden}
#mfx{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;z-index:0;pointer-events:none}
.mwrap h2,.mrow,.mwrap .msg{position:relative;z-index:1}
.mwrap h2{margin:6px 0 8px;font-size:18px;letter-spacing:.1em;color:#eadbbd;-webkit-text-stroke:.8px currentColor}
.mwrap .x{right:10px;top:10px}
.mrow{display:flex;gap:8px;align-items:flex-start;margin-top:6px;padding-bottom:50px}
.mbox{position:relative;flex:none;width:216px;height:408px}
.mbox img{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.mbox #mback{filter:brightness(.68)}
.mbox #mdoll{position:absolute;image-rendering:pixelated;left:16px;top:112px;width:192px;height:192px}
.mopts{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:24px}
.mopts .fl{font-size:14px;font-weight:900;color:#d8c49a;letter-spacing:.06em}
.mopts .tag{color:#ff9a8a}
.mopts select.sel{width:100%;min-width:0;font:inherit;font-size:14px;font-weight:900;color:#f0e2c4;background:rgba(40,26,16,.95);border:2px solid #080503;padding:7px 4px;min-height:36px;text-overflow:ellipsis}
.mopts select.sel.bad{color:#ff9a8a;border-color:#e0482f}
.mopts .stp{gap:0;padding:0;border:2px solid #080503;background:rgba(40,26,16,.9)}
.mopts .stp.bad{border-color:#e0482f}
.mopts .stp button{width:26px;min-height:32px;border:0;background:#4a2a12;color:#f0dfb8;font-size:14px;font-weight:900;padding:0}
.mopts .stp .stv{font-size:14px;font-weight:900;color:#f0e2c4;-webkit-text-stroke:.4px currentColor}
.mopts .stp.bad .stv{color:#ff9a8a}
.mopts .stp .stv small{font-size:10px;font-weight:400;-webkit-text-stroke:0}
.mb{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;z-index:5}
.mb button{flex:1;font:inherit;font-weight:700;font-size:14px;color:#f0dfb8;background:#4a2a12;border:0;padding:10px 0;cursor:pointer;-webkit-text-stroke:.6px currentColor;box-shadow:0 0 0 2px #1d1008,inset 0 2px 0 #7a5a30,inset 0 -2px 0 #2a1608,3px 3px 0 2px rgba(60,30,10,.35)}
.mb button:active{transform:translateY(2px)}
.mb button:disabled{background:#241508;color:#6e5a3e;-webkit-text-stroke:0;cursor:default;transform:none;box-shadow:0 0 0 2px #100a05,inset 0 2px 0 #3a2a18,inset 0 -2px 0 #170d05}
.mwrap .msg{font-size:12px;min-height:1.4em;margin-top:2px;text-align:center}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fields label{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:12px;color:var(--pink2);letter-spacing:.06em}
select.sel{font:inherit;font-size:13px;width:100%;min-width:0;color:var(--pink);background:var(--paper2);border:2px solid var(--lo);padding:7px 6px}
select.sel.bad{color:var(--seal);border-color:var(--seal)}
.tag{color:var(--seal);font-size:11px;margin-left:6px}
.tag[hidden]{display:none}
.jobrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(58,38,22,.18)}
.jobrow small{grid-column:1/-1;color:var(--pink2);font-size:11px}
.row.gc>span:first-child{font-size:17px}.row.gc .v,.row.gc .hint{font-size:15px}.row.gc .hint{font-weight:400}
.sheet .gc .nmbig{font-size:19px;-webkit-text-stroke:.9px currentColor}.sheet .gc .jbig{font-size:18px;-webkit-text-stroke:.9px currentColor}
.sheet .sec.gs{font-size:13px}
.wr{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(58,38,22,.18)}
.wr.off{opacity:.5}
.wr .im{width:32px;height:32px;margin:0 8px;background-size:32px 32px;image-rendering:pixelated}
.wr .im img{display:block;width:32px;height:32px;image-rendering:pixelated}
.wr .t{font-weight:700;font-size:15px}.wr .t small{font-weight:400;-webkit-text-stroke:0;color:var(--pink2);font-size:11px;margin-left:6px}
.wr .a{font-size:12px;line-height:1.5;margin-top:2px}.wr .a i{font-style:normal;color:var(--pink2)}
.wr .rn{display:flex;gap:4px;margin-top:4px}.wr .rn img,.wr .rn span{width:20px;height:20px;image-rendering:pixelated;background:#2b1a0d;box-shadow:0 0 0 1px #1d1008}
.wr .rn span{background:transparent;box-shadow:inset 0 0 0 1px rgba(58,38,22,.4)}
.eqb{font:inherit;font-size:13px;font-weight:700;color:#f0dfb8;background:#4a2a12;border:0;padding:8px 12px;min-width:62px;cursor:pointer;box-shadow:0 0 0 2px #1d1008,inset 0 2px 0 #7a5a30,inset 0 -2px 0 #2a1608}
.eqb:active{transform:translateY(2px)}
.eqb[disabled]{background:var(--paper2);color:var(--pink2);box-shadow:0 0 0 2px var(--lo);cursor:default;transform:none}
.bold{-webkit-text-stroke:.6px currentColor;paint-order:stroke fill}
.sheet h2.bold{-webkit-text-stroke:.8px currentColor}
.ji{width:26px;height:26px;image-rendering:pixelated;flex:none;vertical-align:middle;margin-right:8px}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0}
.pen{all:unset;box-sizing:border-box;cursor:pointer;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center}.pen img{width:32px;height:32px;image-rendering:pixelated;display:block}
.pen:active{transform:translateY(1px)}.pen[disabled]{opacity:.4;cursor:default}
.pen:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.gbtn{display:block;width:100%;margin-top:16px;background:#4a2a12;color:#f0dfb8;border:0;padding:10px 0;text-align:center;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 0 0 2px #1d1008,inset 0 2px 0 #7a5a30,inset 0 -2px 0 #2a1608,3px 3px 0 2px rgba(60,30,10,.35)}
.gbtn:active{transform:translateY(2px)}
.tbtn{font:inherit;font-size:12px;font-weight:400;color:var(--pink);background:var(--paper2);border:2px solid var(--lo);padding:1px 8px;margin-left:10px;cursor:pointer;vertical-align:middle}
.cfm{position:fixed;inset:0;z-index:50;background:rgba(20,10,4,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.cfm .box{background:var(--paper);color:var(--pink);border:3px solid #2b1a0d;box-shadow:0 0 0 2px #7a5a30,4px 4px 0 2px rgba(0,0,0,.35);padding:18px 16px 14px;max-width:300px;width:100%}
.cfm p{margin:0 0 6px;font-size:14px;line-height:1.5}.cfm .sub{font-size:12px;color:var(--pink2)}
.cfm .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
/* 工會證：單一經驗池、升級、轉職 */
.gcard{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.gcard .cell{padding:8px 2px}.gcard .cell small{display:block;font-size:11px;color:var(--pink2);letter-spacing:.06em}
.gcard .cell b{font-size:20px;font-variant-numeric:tabular-nums;-webkit-text-stroke:.5px currentColor}.gcard .cell b i{font-style:normal;font-size:13px;color:#3f6a2c}
.step button,.stp2 button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.qm{font:inherit;font-size:11px;font-weight:900;line-height:16px;width:18px;height:18px;padding:0;margin-left:6px;vertical-align:1px;color:#f0dfb8;background:#4a2a12;border:0;cursor:pointer;box-shadow:0 0 0 2px #1d1008,inset 0 1px 0 #7a5a30}.qtip{margin-top:6px;padding:6px 8px;font-size:12px;line-height:1.5;color:#f0e2c4;background:#3a2414;box-shadow:0 0 0 2px #1d1008;-webkit-text-stroke:0;font-weight:500}.gcard .cell.full{grid-column:1/-1}.gcard .cell.warn b{color:var(--seal)}
.meter{height:10px;background:rgba(58,38,22,.25);margin-top:6px;position:relative;box-shadow:inset 0 0 0 2px rgba(58,38,22,.3)}
.meter i{position:absolute;left:0;top:0;bottom:0;background:#8a6a3a}.meter u{position:absolute;top:0;bottom:0;background:#4f7a3a;opacity:.85}
.bigacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.bigacts .gbtn{margin-top:0;font-size:15px}
.bk{all:unset;box-sizing:border-box;cursor:pointer;font-size:14px;font-weight:700;color:var(--pink);padding:4px 8px 4px 0;display:inline-block;margin-bottom:6px;-webkit-text-stroke:.4px currentColor}
.bk:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

function make(draw,N,noOut){N=N||14;var g=[];for(var y=0;y<N;y++){g[y]=[];}
  function set(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<N&&y<N)g[y][x]=c}
  var api={
    rect:function(x0,y0,x1,y1,c){for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++)set(x,y,c)},

    disc:function(cx,cy,r,c){for(var y=0;y<N;y++)for(var x=0;x<N;x++){var dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy<=r*r)g[y][x]=c}},
    line:function(x0,y0,x1,y1,c){var n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2);for(var i=0;i<=n;i++){var t=i/n;set(x0+(x1-x0)*t,y0+(y1-y0)*t,c)}},

/* 帳棚寵物：好感>=1 且在營地開了「邀請進帳棚」的寵物。阿梅/阿果在 U 型範圍走動，庫奇固定站著、尾巴不動。座標是 130x140 場景的腳底位置 */
var TENT={x0:32,x1:96,y0:108,y1:128,aw:16,yt:88,kx:84,ky:80,sz:1.3,ty:103},TP=[];
function tInU(x,y){if(x<TENT.x0||x>TENT.x1||y>TENT.y1||y<TENT.yt)return false;if(y>=TENT.y0)return true;return x<=TENT.x0+TENT.aw||x>=TENT.x1-TENT.aw}
function tRnd(a,b){return a+Math.random()*(b-a)}
function tPt(){for(var i=0;i<60;i++){var x=tRnd(TENT.x0,TENT.x1),y=tRnd(TENT.yt,TENT.y1);if(tInU(x,y))return[x,y]}return[TENT.x0,TENT.y1]}
function tPlace(p,moving){p.el.style.zIndex=p.y<=TENT.ty?4:10+Math.round(p.y);var s=p.px*TENT.sz,bob=moving?Math.abs(Math.sin(p.t*9))*1.2:0;p.el.style.width=(s/130*100)+'%';p.el.style.left=((p.x-s/2)/130*100)+'%';p.el.style.top=((p.y-s-bob)/140*100)+'%';p.el.style.transform='scaleX('+p.face+')'}
var K=null;
function kTail(step){if(K.tails[step])return K.tails[step];
  var src=document.createElement('canvas');src.width=src.height=16;var sc=src.getContext('2d');sc.drawImage(K.tail,0,0);
  var sd=sc.getImageData(0,0,16,16).data,c=document.createElement('canvas');c.width=c.height=16;var cx=c.getContext('2d'),od=cx.createImageData(16,16),
  ang=step/3*0.42,ca=Math.cos(ang),sa=Math.sin(ang),bx=3.5,by=10;
  for(var y=0;y<16;y++)for(var X=0;X<16;X++){var dx=X+.5-bx,dy=y+.5-by,u=Math.floor(bx+dx*ca+dy*sa),v=Math.floor(by-dx*sa+dy*ca);
    if(u<0||v<0||u>15||v>15)continue;var i=(v*16+u)*4,o=(y*16+X)*4;if(sd[i+3]>0){od.data[o]=sd[i];od.data[o+1]=sd[i+1];od.data[o+2]=sd[i+2];od.data[o+3]=255}}
  cx.putImageData(od,0,0);return(K.tails[step]=c)}
function kDraw(step){if(!K||K.step===step)return;K.step=step;var x=K.cv.getContext('2d');x.clearRect(0,0,16,16);x.drawImage(kTail(step),1,0);x.drawImage(K.body,0,0)}

  var room=$('room'),want=[['gm_pet_01',14,0],['gm_pet_02',14,0],['gm_pet_03',16,1]].filter(function(w){var d=pets&&pets[w[0]];return d&&d.tent&&(d.lv|0)>=1});

    var el=document.createElement(w[2]?'canvas':'img');el.className='tp';if(!w[2])el.alt='';
    var p={el:el,px:w[1],fixed:!!w[2],t:Math.random()*9,face:1,wait:tRnd(.3,2),stuck:0};
    if(p.fixed){el.width=el.height=16;p.x=TENT.kx;p.y=TENT.ky;tPlace(p,false);
      var a=new Image(),b=new Image(),n=0,go=function(){if(++n<2)return;K={body:a,tail:b,tails:{},cv:el,step:null};kDraw(0)};
      a.onload=b.onload=go;a.src=BASE+'pets/gm_pet_03.png?v='+V;b.src=BASE+'pets/gm_pet_03_tail.png?v='+V}
    else{var q=tPt();p.x=p.tx=q[0];p.y=p.ty=q[1];el.src=BASE+'pets/'+w[0]+'.png?v='+V;tPlace(p,false);TP.push(p)}
    room.appendChild(el)});
  if(!want.length)return;var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;if(reduce)return;
  var last=performance.now();

    kDraw(Math.round(Math.sin(now/1100)*3));

      if(p.wait>0)p.wait-=dt;else{var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
        if(d<.8||p.stuck>1.2){p.wait=tRnd(.8,3);var q=tPt();p.tx=q[0];p.ty=q[1];p.stuck=0}
        else{var v=15*dt,m=Math.min(v,d),nx=p.x+dx/d*m,ny=p.y+dy/d*m;

          if(Math.abs(dx)>.5)p.face=dx<0?-1:1}}
      tPlace(p,moving)});
    requestAnimationFrame(loop)})(last)}
