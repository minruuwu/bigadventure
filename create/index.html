<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冒險者登記</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* Layout: loose pixel pages on a dark plank table, one candle at the upper left.
   Everything is built on a 4px grid. Left page = portrait + name; right page = the seven choices + seal. Phones merge both pages into one sheet. */
:root{
  color-scheme:dark;
  --ink:#2a190b; --ink-soft:#5b4127; --line:#2a190b; --hi:rgba(255,244,210,.5); --lo:rgba(70,40,15,.26);
  --fill:#dcc491; --fill-hover:#e8d6a8; --fill-lock:#cdb07a; --paper-0:#e0c795;
  --seal:#8a2c20; --seal-dark:#2e0f0a; --seal-fg:#f3dfba;
  --pxb:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line);
  --font:"DotGothic16","Noto Serif TC","Songti TC","PMingLiU",serif;
}
html,body{height:100%}
body{margin:0;background:#1a0f08;color:var(--ink);font-family:var(--font);font-size:16px;line-height:24px;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;overflow-x:hidden}
canvas{image-rendering:pixelated}
#table{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.candle{display:none;position:fixed;z-index:3;top:5vh;left:max(16px,calc(50% - 440px - 118px));width:56px;height:128px}
@media (min-width:1100px){.candle{display:block}}

.stage{position:relative;z-index:4;box-sizing:border-box;min-height:100%;display:flex;align-items:center;justify-content:center;padding-inline:8px;padding-block:12px}
.pagebox{position:relative;width:100%;max-width:892px;box-sizing:border-box;padding:0 12px 12px 0}
.paper{position:absolute;inset:0;width:100%;height:100%}
.pages{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr)}
.page{box-sizing:border-box;min-width:0;display:flex;flex-direction:column;gap:12px;padding:28px}
.page-left{padding-bottom:4px}.page-right{padding-top:4px}
@media (min-width:720px){
  .pages{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .page{gap:16px;padding:36px 40px 40px}
  .page-left{padding:36px 36px 40px 40px}.page-right{padding:36px 36px 40px 44px}
}

.eyebrow{margin:0;letter-spacing:.3em;color:var(--ink-soft)}
h1{margin:0;font-size:16px;line-height:24px;font-weight:400;letter-spacing:.2em}
.eyebrow,.rhead{display:none}
.rule{height:4px;margin:8px 0 0;border:0;background:repeating-linear-gradient(90deg,var(--ink-soft) 0 8px,transparent 8px 12px)}
@media (min-width:720px){
  .eyebrow{display:block}
  h1{font-size:32px;line-height:40px;letter-spacing:.12em}
  .rhead{display:block}
}

.left-body{display:grid;grid-template-columns:minmax(0,1fr);justify-items:start;gap:4px}
.portrait{position:relative;display:flex;justify-content:center;align-items:flex-end;margin:4px;padding:8px;background:#c9aa72;
  box-shadow:var(--pxb),inset 4px 4px 0 0 var(--lo),inset -4px -4px 0 0 var(--hi)}
#sprite{display:block}
.fields{width:100%;display:flex;flex-direction:column;gap:4px;min-width:0}
.fields label{letter-spacing:.3em;color:var(--ink-soft)}
.nameline{position:relative;display:flex;align-items:baseline;gap:8px;padding-bottom:8px}
.nameline::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 12px)}
.nameline:focus-within::after{background:repeating-linear-gradient(90deg,var(--seal) 0 8px,transparent 8px 12px)}
#name{flex:1;min-width:0;background:transparent;border:0;outline:0;font:inherit;font-size:16px;line-height:24px;color:var(--ink);padding:0;caret-color:var(--seal);border-radius:0}
#name::placeholder{color:rgba(91,65,39,.7)}
#count{color:var(--ink-soft)}
#msg{margin:0;min-height:0;color:var(--seal)}
.jobnote{display:none}
@media (min-width:720px){
  .left-body{gap:8px}
  .jobnote{display:block;width:100%}
}
.jobnote h3{margin:0;font-size:16px;font-weight:400;letter-spacing:.12em}
.jobnote h3 small{font-size:16px;color:var(--ink-soft);margin-left:8px;letter-spacing:.04em}
.jobnote p{margin:4px 0 0;color:var(--ink-soft)}

.slots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.slots li:last-child{grid-column:1/-1}
.slot{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:4px 8px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l l" "v t";align-items:center;column-gap:8px;
  background:transparent;border-bottom:4px solid var(--ink-soft)}
.slot:hover{background-color:rgba(255,246,222,.4)}
.slot:active{transform:translateY(2px)}
.slot .l{grid-area:l;letter-spacing:.2em;color:var(--ink-soft)}
.slot .t{grid-area:t;color:var(--ink-soft)}
.slot .v{grid-area:v;display:flex;align-items:center;gap:8px;min-width:0}
.slot.locked{border-bottom:0;background-image:repeating-linear-gradient(90deg,var(--ink-soft) 0 8px,transparent 8px 12px);background-size:100% 4px;background-repeat:no-repeat;background-position:0 100%}
.slot.locked .v{color:var(--ink-soft)}
.figure{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%}
.stamp{flex:none;display:block}
.finwrap{position:relative;margin-top:36px}
.quill{position:absolute;right:16px;top:-62px;z-index:2;pointer-events:none;filter:drop-shadow(3px 3px 0 rgba(42,25,11,.35))}
.chip{display:inline-block;width:16px;height:16px;margin:4px;box-shadow:0 0 0 4px var(--line);flex:none}
:is(.slot,.seal,.btn,.tab,.opt,.swatch,.x):focus-visible{outline:4px solid var(--seal);outline-offset:4px}

.seal{all:unset;box-sizing:border-box;width:calc(100% - 8px);cursor:pointer;display:block;margin:8px 4px 4px;padding:12px 16px;text-align:center;letter-spacing:.5em;text-indent:.5em;color:var(--seal-fg);
  background:var(--seal);box-shadow:0 -4px 0 0 var(--seal-dark),0 4px 0 0 var(--seal-dark),-4px 0 0 0 var(--seal-dark),4px 0 0 0 var(--seal-dark),inset 4px 4px 0 0 rgba(255,190,150,.35),inset -4px -4px 0 0 rgba(40,8,4,.4)}
.seal:hover{background:#9c3526}
.seal:active{transform:translateY(4px)}

.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background-color:rgba(8,4,2,.5);
  background-image:conic-gradient(rgba(8,4,2,.5) 25%,transparent 0 50%,rgba(8,4,2,.5) 0 75%,transparent 0);background-size:8px 8px}
.overlay[hidden]{display:none}
.sheetwrap{position:relative;box-sizing:border-box;width:100%;max-width:456px;max-height:min(90dvh,700px);display:flex;padding:0 12px 12px 0}
.sheetwrap .paper{z-index:0}
.sheet{position:relative;z-index:1;flex:1;min-height:0;box-sizing:border-box;overflow:auto;padding:32px 32px 28px}
.sheet h2{margin:0 36px 4px 0;font-size:16px;line-height:24px;font-weight:400;letter-spacing:.2em}
.sheet .lead{margin:0 0 12px;color:var(--ink-soft)}
.x{all:unset;position:absolute;top:28px;right:28px;width:24px;height:24px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--fill);box-shadow:var(--pxb)}
.x:hover{background:var(--fill-hover)}
.foot{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;padding-right:4px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;margin:4px;padding:4px 16px;background:var(--fill);box-shadow:var(--pxb),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--lo)}
.btn:hover{background:var(--fill-hover)}
.btn:active{transform:translateY(4px)}
.btn.main{background:var(--seal);color:var(--seal-fg);box-shadow:0 -4px 0 0 var(--seal-dark),0 4px 0 0 var(--seal-dark),-4px 0 0 0 var(--seal-dark),4px 0 0 0 var(--seal-dark),inset 4px 4px 0 0 rgba(255,190,150,.35),inset -4px -4px 0 0 rgba(40,8,4,.4)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{all:unset;box-sizing:border-box;cursor:pointer;margin:4px;padding:0 12px;background:var(--fill);box-shadow:var(--pxb),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--lo)}
.tab[aria-pressed=true]{background:var(--ink);color:var(--paper-0);box-shadow:var(--pxb)}
.sheet h3{margin:16px 0 8px;font-size:16px;font-weight:400;letter-spacing:.3em;color:var(--ink-soft)}
.sheet h3{display:flex;align-items:center;gap:12px}
.sheet h3.hq{position:relative}
.qbtn{all:unset;box-sizing:border-box;cursor:pointer;width:24px;height:24px;margin:4px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;letter-spacing:0;color:var(--ink);background:var(--fill);box-shadow:var(--pxb),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--lo)}
.qbtn:hover{background:var(--fill-hover)}
.qbtn[aria-expanded=true]{background:var(--ink);color:var(--paper-0);box-shadow:var(--pxb)}
.qbtn:focus-visible{outline:2px solid var(--seal);outline-offset:4px}
.tip{position:absolute;z-index:6;left:4px;right:4px;top:100%;margin-top:4px;padding:8px 12px;background:var(--paper-0);color:var(--ink);font-size:16px;line-height:24px;letter-spacing:.04em;box-shadow:var(--pxb),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--lo)}
.tip[hidden]{display:none}
.desc{margin:0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stat{margin:4px;padding:0 4px;text-align:center;background:var(--fill);box-shadow:var(--pxb)}
.stat b{display:block;font-weight:400;color:var(--ink-soft)}
.stat.on span{color:var(--seal)}.stat.off span{color:var(--ink-soft);opacity:.55}
.bonus{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.bonus li{display:flex;justify-content:space-between;gap:8px}
.bonus li span:last-child{color:var(--seal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{margin:4px;padding:0 12px;background:var(--fill);box-shadow:var(--pxb)}
.opts{display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;width:calc(100% - 8px);cursor:pointer;margin:4px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;padding:4px 12px;background:var(--fill);box-shadow:var(--pxb),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--lo)}
.opt:hover{background:var(--fill-hover)}
.opt .n{font-size:32px;line-height:40px;text-align:center}
.opt .d{color:var(--ink-soft)}
.opt[aria-checked=true]{background:var(--ink);color:var(--paper-0);box-shadow:var(--pxb)}
.opt[aria-checked=true] .d{color:#c9ad7c}
.opt[aria-disabled=true]{opacity:.5;cursor:not-allowed;background-image:conic-gradient(rgba(90,60,30,.16) 25%,transparent 0 50%,rgba(90,60,30,.16) 0 75%,transparent 0);background-size:8px 8px}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.swatch{all:unset;box-sizing:border-box;width:calc(100% - 8px);cursor:pointer;margin:4px;display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;background:var(--fill);box-shadow:var(--pxb),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--lo)}
.swatch:hover{background:var(--fill-hover)}
.swatch .chip{width:24px;height:24px}
.swatches.thumbs{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.swatch canvas{display:block;margin:4px 0}
.swatch[aria-checked=true]{background:var(--ink);color:var(--paper-0);box-shadow:var(--pxb)}
.ph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ph div{margin:4px;padding:8px 0;text-align:center;color:var(--ink-soft);background-image:conic-gradient(rgba(90,60,30,.18) 25%,transparent 0 50%,rgba(90,60,30,.18) 0 75%,transparent 0);background-size:8px 8px;box-shadow:var(--pxb)}
.cur{display:flex;align-items:center;gap:8px;margin:4px;padding:4px 12px;background:var(--fill);box-shadow:var(--pxb)}
.cur small{margin-left:auto;color:var(--ink-soft);font-size:16px}
.reg{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 16px}
.reg dt{color:var(--ink-soft);letter-spacing:.2em}.reg dd{margin:0}
.note{margin:16px 0 0;color:var(--ink-soft)}
#dbg{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;margin:0;padding:4px 8px;background:#000;color:#ff9a8a}
.pagebox.nopaint .pages{background:#c4a06c;box-shadow:0 0 0 4px #2a190b}

.treebtn{all:unset;box-sizing:border-box;cursor:pointer;margin:4px 4px 12px;padding:0 12px;display:inline-block;background:var(--fill);box-shadow:var(--pxb),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--lo)}
.treebtn:hover{background:var(--fill-hover)}
.treebtn:focus-visible{outline:2px solid var(--seal);outline-offset:4px}
.tmap{display:block;width:100%;max-width:340px;margin:0 auto 4px;height:auto;touch-action:manipulation}
.tmap g.n{cursor:pointer}.tmap g.n:focus-visible rect.foc{stroke:var(--seal);stroke-width:2}
.tmap .dim{opacity:.28}
.tcap .tname{font-weight:700;color:var(--ink);text-shadow:.6px 0 0 currentColor}
.tcap{margin:0 0 8px;text-align:center;color:var(--ink-soft)}
.tlegend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin:0 0 8px;color:var(--ink-soft);font-size:14px}
.tlegend i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-1px;box-shadow:0 0 0 2px #3b2713}
.treq{margin:0 0 8px;color:var(--ink-soft)}
.treq b{font-weight:400;color:var(--seal)}
</style>

<canvas id="table" aria-hidden="true"></canvas>
<canvas class="candle" id="candle" aria-hidden="true"></canvas>

<main class="stage">
  <div class="pagebox" id="pagebox">
    <canvas class="paper" id="paper" aria-hidden="true"></canvas>
    <div class="pages" id="pages">
      <section class="page page-left" aria-label="姓名與預覽">
        <header>
          <p class="eyebrow">冒險者名冊</p>
          <h1>登記新的冒險者</h1>
          <hr class="rule">
        </header>
        <div class="left-body">
          <div class="figure"><div class="portrait"><canvas id="sprite" aria-label="角色預覽"></canvas></div><canvas class="stamp" id="stamp" aria-hidden="true"></canvas></div>
          <div class="fields">
            <label for="name">姓名</label>
            <div class="nameline"><input id="name" type="text" maxlength="10" placeholder="寫下名字" autocomplete="off"><span id="count">0/10</span></div>
            <p id="msg" role="status"></p>
          </div>
        </div>
        <div class="jobnote" id="jobnote"></div>
      </section>

      <section class="page page-right" aria-label="外觀與職業">
        <header class="rhead">
          <p class="eyebrow">職業與外觀</p>
          <h1>選擇模樣</h1>
          <hr class="rule">
        </header>
        <ul class="slots" id="slots"></ul>
        <div class="finwrap"><button type="button" class="seal" id="finish">完成登記</button><canvas class="quill" id="quill" aria-hidden="true"></canvas></div>
      </section>
    </div>
  </div>
</main>

<p id="dbg" hidden></p>
<div class="overlay" id="overlay" hidden>
  <div class="sheetwrap" id="sheetwrap">
    <canvas class="paper" id="sheetbg" aria-hidden="true"></canvas>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>
</div>

<script>
(function(){
  /* ===== data loader: reads the CSV tables in ../assets/data/ ===== */
  var DATA = '../assets/data/';
  function parseCSV(t){
    t = t.replace(/^﻿/, ''); var rows = [], row = [], f = '', q = false, i, c;
    for(i = 0; i < t.length; i++){
      c = t.charAt(i);
      if(q){ if(c === '"'){ if(t.charAt(i+1) === '"'){ f += '"'; i++; } else q = false; } else f += c; }
      else if(c === '"') q = true;
      else if(c === ','){ row.push(f); f = ''; }
      else if(c === '\n' || c === '\r'){ if(c === '\r' && t.charAt(i+1) === '\n') i++; row.push(f); f = ''; if(row.length > 1 || row[0] !== '') rows.push(row); row = []; }
      else f += c;
    }
    if(f !== '' || row.length){ row.push(f); rows.push(row); }
    var head = rows.shift();
    return rows.map(function(r){ var o = {}; head.forEach(function(h,k){ o[h.trim()] = (r[k] == null ? '' : r[k]).trim(); }); return o; });
  }
  function getCSV(name){
    return fetch(DATA + name).then(function(r){ if(!r.ok) throw new Error(name + ' ' + r.status); return r.arrayBuffer(); })
      .then(function(b){ return parseCSV(new TextDecoder('utf-8').decode(b)); });
  }
  var ATTR = [['hp_bonus','生命'],['p_atk_bonus','物理攻擊'],['m_atk_bonus','魔法攻擊'],['p_def_bonus','物理防禦'],['m_def_bonus','魔法防禦'],['eva_rate_bonus','閃避率'],['crit_rate_bonus','暴擊率'],['crit_damage_rate_bonus','暴擊傷害'],['speed_bonus','速度'],
    ['fire_res_rate_bonus','火焰抗性'],['frost_res_rate_bonus','冰霜抗性'],['lightning_res_rate_bonus','雷電抗性'],['wind_res_rate_bonus','風之抗性'],['nature_res_rate_bonus','自然抗性'],['light_res_rate_bonus','光明抗性'],['dark_res_rate_bonus','黑暗抗性']];
  var STAT_KEYS = ['str','int','agi','vit','luk'];
  var WEAPON_ORDER = ['劍','斧','匕','弓','錘','杖','槍','書'];
  function buildData(R){
    var info = R[0], lvl = {}, attr = {}, wp = R[3];
    R[1].forEach(function(r){ lvl[r.u_sn] = r; }); R[2].forEach(function(r){ attr[r.u_sn] = r; });
    var wname = {}; wp.forEach(function(w){ wname[w.weapon_e_name.toLowerCase()] = w.weapon_name; });
    var tree = info.map(function(r){
      var L = lvl[r.u_sn] || {}, A = attr[r.u_sn] || {}, g = {}, bonus = [], allow = [], req = [];
      STAT_KEYS.forEach(function(k){ if(L['per_level_' + k]) g[k] = parseInt(L['per_level_' + k], 10); });
      ATTR.forEach(function(a){ if(A[a[0]]) bonus.push([a[1], A[a[0]]]); });
      Object.keys(r).forEach(function(c){ if(c.indexOf('usable_') === 0 && r[c] && wname[c.slice(7)]) allow.push(wname[c.slice(7)]); });
      [1,2].forEach(function(n){ if(r['required_job_' + n]) req.push([r['required_job_' + n], parseInt(r['required_job_' + n + '_level'], 10)]); });
      return {sn:r.u_sn, name:r.job_name, ename:r.job_e_name, desc:r.job_desc, reqdesc:r.required_desc, req:req, growth:g, bonus:bonus, allow:allow, defsn:r.default_weapon || ''};
    });
    var weapons = WEAPON_ORDER.map(function(n){ var w = wp.filter(function(x){ return x.weapon_name === n; })[0], cu = w ? parseFloat(w.cut) : NaN; return {n:n, t:w ? w.weapon_desc : '', sn:w ? w.u_sn : '', cut:isNaN(cu) ? 1 : cu, offhand:w ? (w.offhand || '') : ''}; });
    return {tree:tree, weapons:weapons};
  }
  Promise.all(['job_info.csv','job_level_up.csv','job_attribute.csv','weapon_info.csv'].map(getCSV)).then(function(R){ start(buildData(R)); }).catch(function(e){
    var m = document.createElement('p'); m.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99;margin:0;padding:8px;background:#000;color:#ff9a8a;font:14px sans-serif';
    m.textContent = '資料表載入失敗：' + e.message + '（請用網址開啟，不能直接用檔案開啟）'; document.body.appendChild(m);

    var t1=[V(-Math.PI/2),V(Math.PI/6),V(Math.PI*5/6)],t2=[V(Math.PI/2),V(Math.PI*7/6),V(-Math.PI/6)];
    [t1,t2].forEach(function(t){for(var i=0;i<3;i++){var p=t[i],q=t[(i+1)%3];line(p[0],p[1],q[0],q[1],1.5,K.dk)}});
    [t1,t2].forEach(function(t){for(var i=0;i<3;i++){var p=t[i],q=t[(i+1)%3];line(p[0],p[1],q[0],q[1],0.55,K.wine)}});
    [t1,t2].forEach(function(t){t.forEach(function(p){stamp(p[0],p[1],1.9,K.dk);stamp(p[0],p[1],0.9,K.pale)})})})();
  // ---- crossed sword (point down, cross guard) and crook staff, behind the compass ----
  (function(){
    var hx=47,hy=12,tx=16,ty=52,vx=tx-hx,vy=ty-hy,L=Math.hypot(vx,vy),ux=vx/L,uy=vy/L,nx=-uy,ny=ux;
    function at(t){return [hx+vx*t,hy+vy*t]}
    var gp=at(0.14),g1=[gp[0]-nx*8,gp[1]-ny*8],g2=[gp[0]+nx*8,gp[1]+ny*8];
    var crook=[[19,16],[19.8,11.5],[17.2,8.4],[13.6,9],[12.4,12.6]];
    line(hx,hy,tx,ty,3.0,K.dk);line(g1[0],g1[1],g2[0],g2[1],2.6,K.dk);stamp(g1[0],g1[1],3.1,K.dk);stamp(g2[0],g2[1],3.1,K.dk);stamp(hx-ux*2.2,hy-uy*2.2,3.4,K.dk);
    line(19,16,47,51,2.6,K.dk);crook.reduce(function(p,q){line(p[0],p[1],q[0],q[1],2.6,K.dk);return q});
    var b0=at(0.14);line(b0[0],b0[1],tx,ty,1.7,K.pale);line(hx,hy,b0[0],b0[1],1.4,K.tint);
    line(g1[0],g1[1],g2[0],g2[1],1.3,K.pale);stamp(g1[0],g1[1],1.7,K.pale);stamp(g2[0],g2[1],1.7,K.pale);stamp(hx-ux*2.2,hy-uy*2.2,2.1,K.pale);
    line(19,16,47,51,1.4,K.tint);crook.reduce(function(p,q){line(p[0],p[1],q[0],q[1],1.4,K.tint);return q});
  })();
  // ---- large compass rose in front ----
  var rx=cx,ry=cy;
  function tri(ax,ay,bx,by,cxx,cyy,col){var minx=Math.floor(Math.min(ax,bx,cxx)),maxx=Math.ceil(Math.max(ax,bx,cxx)),miny=Math.floor(Math.min(ay,by,cyy)),maxy=Math.ceil(Math.max(ay,by,cyy));
    for(var y=miny;y<=maxy;y++)for(var xx=minx;xx<=maxx;xx++){var px_=xx+.5,py_=y+.5;
      var d1=(px_-bx)*(ay-by)-(ax-bx)*(py_-by),d2=(px_-cxx)*(by-cyy)-(bx-cxx)*(py_-cyy),d3=(px_-ax)*(cyy-ay)-(cxx-ax)*(py_-ay);
      var neg=(d1<0)||(d2<0)||(d3<0),pos=(d1>0)||(d2>0)||(d3>0);if(!(neg&&pos))set(xx,y,col)}}
  var dirs=[[0,-1,23,7.5],[1,0,19,7.0],[0,1,23,7.5],[-1,0,19,7.0],[.7071,-.7071,15,5.0],[.7071,.7071,15,5.0],[-.7071,.7071,15,5.0],[-.7071,-.7071,15,5.0]];
  // diagonal (short) points first so the main points sit on top
  var order=dirs.slice(4).concat(dirs.slice(0,4));
  order.forEach(function(d){var tx=rx+d[0]*d[2],ty=ry+d[1]*d[2],nx=-d[1],ny=d[0],bw=d[3];
    tri(rx+nx*(bw+1.1),ry+ny*(bw+1.1),tx+d[0]*1.3,ty+d[1]*1.3,rx,ry,K.dk);tri(rx-nx*(bw+1.1),ry-ny*(bw+1.1),tx+d[0]*1.3,ty+d[1]*1.3,rx,ry,K.dk);
    tri(rx+nx*bw,ry+ny*bw,tx,ty,rx,ry,K.wine);tri(rx-nx*bw,ry-ny*bw,tx,ty,rx,ry,K.pale)});
  // centre dial: wine disc, dark ring, unprinted hub
  stamp(rx,ry,9.6,K.dk);stamp(rx,ry,8.4,K.wine);stamp(rx,ry,6.6,K.dk);stamp(rx,ry,5.6,K.pale);stamp(rx,ry,2.6,K.dk);stamp(rx,ry,1.4,K.wine);
  for(var i=0;i<16;i++){var an=i/16*Math.PI*2,r1=9.0;set(rx+Math.cos(an)*r1,ry+Math.sin(an)*r1,i%2?K.pale:K.pale)}   // tick marks cut into the dial
  // north marker: a small diamond above the long north point
  polyFill([[rx,ry-27.5],[rx+2.2,ry-25],[rx,ry-22.5],[rx-2.2,ry-25]],K.dk,1);polyFill([[rx,ry-26.5],[rx+1.2,ry-25],[rx,ry-23.5],[rx-1.2,ry-25]],K.wine,0);
  // ---- print: one ink colour, uneven pressure, paper showing through ----
  function nz(X,Y){return Math.sin(X*0.31+1.7)*Math.sin(Y*0.27+0.4)+0.6*Math.sin((X+Y)*0.17+2.1)+0.4*Math.sin(X*0.9)*Math.sin(Y*0.8+1)}
  var drawn={};
  // outline every unprinted (paper-coloured) figure with dark ink so it still reads as a shape
  (function(){var add=[];Object.keys(g).forEach(function(k){if(g[k]===K.pale)return;var p=k.split(',').map(Number);
    var nearPale=[[1,0],[-1,0],[0,1],[0,-1]].some(function(d){return g[(p[0]+d[0])+','+(p[1]+d[1])]===K.pale});
    if(nearPale&&g[k]!==K.dk)add.push(k)});add.forEach(function(k){g[k]=K.dk})})();
  Object.keys(g).forEach(function(k){var p=k.split(',').map(Number),col=g[k],X=p[0],Y=p[1];
    if(col===K.pale)return;                                   // paper colour: leave it unprinted
    if(col===K.tint&&((X+Y)%2!==0))return;                    // light tone: halftone dots only
    var n=nz(X,Y),patch=n>1.5,thin=0;
    var nb=0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){if(g[(X+d[0])+','+(Y+d[1])])nb++});
    if(nb<=2)thin=0.03;                                       // thin lines break up first
    var drop=0.01+(patch?0.22:0)+thin+(n<-1.0?0.12:0);
    if(rr()<drop)return;
    if(col===K.wine){col=n<-0.45?'#963022':(n>0.25?'#84271c':K.wine)}
    drawn[k]=col;x.fillStyle=col;x.fillRect(X,Y,1,1)});
  // ink squash: a few dots just outside the dark outline
  Object.keys(drawn).forEach(function(k){if(drawn[k]!==K.dk)return;var p=k.split(',').map(Number);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var kk=(p[0]+d[0])+','+(p[1]+d[1]);if(!g[kk]&&rr()<0.07&&p[0]+d[0]>=0&&p[1]+d[1]>=0&&p[0]+d[0]<W&&p[1]+d[1]<H){x.fillStyle=K.dk;x.fillRect(p[0]+d[0],p[1]+d[1],1,1)}})});
}

  function drawQuill(){
    var Z = Math.max(2, scale-1);                 // 3px on desktop, 2px on phone -> keep it small
    paintStamp($('stamp'), scale<4?2:3);
    paintQuill($('quill'), 32, 2, Z+0, {rows:[], ends:[]});
    var q=$('quill'); q.style.width=(32*(scale<4?3:3))+'px'; q.style.height=(32*3)+'px';
  }
  function relayout(){
    if(relayoutQueued) return; relayoutQueued = true;
    requestAnimationFrame(function(){
      relayoutQueued = false;
      safe('畫面', function(){ fit(); drawQuill(); buildTable(); paintPages(); if(!$('overlay').hidden) paintSheet(); });
    });
  }
  function report(label, e){
    var d = $('dbg'); d.hidden = false; d.textContent += label + '：' + ((e && e.message) || e) + '　';
    if(window.console) console.error(label, e);
  }
  function safe(label, fn){ try{ fn(); return true; }catch(e){ report(label, e); return false; } }
  function boot(){
    safe('髮色', prepareHair);
    requestAnimationFrame(frame);
    safe('選單', function(){ buildSlots(); renderNote(); refreshSlots(); });
    safe('桌面', buildTable);
    if(!safe('書頁', paintPages)) $('pagebox').classList.add('nopaint');
    safe('羽毛筆', drawQuill);
    safe('蠟燭', function(){ drawCandle(0); });
    window.addEventListener('resize', relayout);
    if(window.ResizeObserver){ new ResizeObserver(relayout).observe($('pagebox')); new ResizeObserver(function(){ if(!$('overlay').hidden) paintSheet(); }).observe($('sheetwrap')); }
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
    if(!reduce){
      var fi = 0;
      setInterval(function(){
        var n = Math.floor(Math.random()*3); if(n === fi) n = (n+1)%3; fi = n;
        safe('蠟燭', function(){ drawCandle(fi); drawTable((Math.random()-0.5)*0.12); });
      }, 140);
    }
  }
  var pending = 0;
  function load(src, cb){
    pending++; var im = new Image();
    im.onload = function(){ cb(im); if(--pending === 0) boot(); };
    im.onerror = function(){ report('圖片', '載入失敗'); if(--pending === 0) boot(); };
    im.src = src;
  }
  imgs.jobs = []; ASSETS.jobs.forEach(function(src,i){ load(src, function(im){ imgs.jobs[i] = im; }); var b = new Image(); b.onload = function(){ jobBack[i] = b; }; b.onerror = function(){}; b.src = src.replace(/\.png$/, '_b.png'); });
  WEAPONS.forEach(function(w){ if(w.sn){ silent('../assets/weapons/' + w.sn + '_1.png'); if(w.offhand) silent('../assets/weapons/' + w.offhand + '.png'); } });
  ASSETS.skins.forEach(function(s,i){ load(s.src, function(im){ skinImgs[i] = im; }); });
  ASSETS.styles.forEach(function(s,i){ load(s.src, function(im){ styleImgs[i] = im; }); });
  ASSETS.eyes.forEach(function(s,i){ load(s.src, function(im){ eyeImgs[i] = im; }); });
  }
})();
