<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鍛造頁模擬</title>
<style>

--cpB:polygon(0 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% 100%,6px 100%,6px calc(100% - 2px),4px calc(100% - 2px),4px calc(100% - 4px),2px calc(100% - 4px),2px calc(100% - 6px),0 calc(100% - 6px));
--cpC:polygon(0 4px,2px 4px,2px 2px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 6px),calc(100% - 2px) calc(100% - 6px),calc(100% - 2px) calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) calc(100% - 2px),calc(100% - 6px) calc(100% - 2px),calc(100% - 6px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px));

--rust:linear-gradient(rgba(150,70,25,.85),rgba(150,70,25,.85)) 2px 10px/2px 7px no-repeat,linear-gradient(rgba(120,55,20,.8),rgba(120,55,20,.8)) calc(100% - 16px) calc(100% - 4px)/9px 2px no-repeat,linear-gradient(rgba(150,70,25,.7),rgba(150,70,25,.7)) 14px 2px/6px 2px no-repeat;
--font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#120c08 var(--wall,none);background-size:96px 48px;image-rendering:pixelated;color:var(--fg);font-family:var(--font);line-height:1.5}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 0,rgba(0,0,0,.55) 70%,rgba(0,0,0,.85) 100%)}

@keyframes flick{0%{opacity:1}33%{opacity:.78}66%{opacity:.92}100%{opacity:1}}
canvas{image-rendering:pixelated;display:block}
.grain{position:fixed;inset:0;pointer-events:none;z-index:60;background-size:480px 480px;image-rendering:pixelated;opacity:1}
button{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.px,.card,.sum,.pts,.temper,.opt,.btn,.chip,.stage,.ghost,.step button,.toast,.enslot{border:0;box-shadow:inset 0 0 0 2px var(--bd),inset 0 4px 0 0 var(--hi),inset 0 -4px 0 0 var(--lo);clip-path:var(--cpA)}
.chip:nth-child(even),.opt:nth-child(even),.stage:nth-child(even),.temper:nth-child(even),.enslot:nth-child(even),.sum:nth-child(even),.btn:nth-child(even),.step button:nth-child(odd){clip-path:var(--cpB)}

.card,.sum,.pts,.temper{background:var(--rivets),var(--rust),var(--wear) 0 0/288px 288px,linear-gradient(180deg,rgba(220,235,255,.07),rgba(0,0,0,.26)),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),var(--panel)}
.opt,.stage,.chip,.enslot{background:var(--wear) 0 0/288px 288px,linear-gradient(180deg,rgba(220,235,255,.07),rgba(0,0,0,.26)),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),var(--panel)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#1f262e;border-bottom:4px solid #06080b;box-shadow:inset 0 -3px 0 #5d6b7c,0 4px 0 rgba(0,0,0,.4)}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.3em;text-shadow:2px 2px 0 #000}

.main{flex:1;padding:16px 18px 100px;display:flex;flex-direction:column;gap:14px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chip{padding:8px 2px 7px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;position:relative;font-size:15px;font-weight:700;line-height:1.2;text-shadow:1px 1px 0 #000}

.stat{font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums}

.bar{height:8px;background:#06080b;margin-top:5px;box-shadow:inset 0 0 0 2px #3a4654;padding:2px}

.barcap{font-size:11px;color:var(--dim)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{--hi:#d49a52;--lo:#3d230d;background:#7a4f22;min-height:54px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:manipulation;text-shadow:1px 1px 0 #000}
.btn small{font-size:11px;font-weight:400;color:#f6dfae}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{--hi:#3a4654;--lo:#0f1318;background:#222a33;color:#6f7c8c;cursor:default;text-shadow:none}
.btn:disabled small{color:#d08a6a}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.opt:focus-visible,.tab:focus-visible,.arr:focus-visible,.ghost:focus-visible,.step button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#171c22;box-shadow:inset 0 0 0 2px #06080b,inset 0 4px 0 #5d6b7c}

.ghost{background:#3a4654;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:700}

.step button:disabled{background:#171c22;color:#556272;cursor:default}

.tier{display:flex;flex-direction:column;gap:8px}
.tier.lock{opacity:.5}
.tierh{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);letter-spacing:.1em;text-shadow:1px 1px 0 #000}
.opt{padding:9px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt .t{font-size:14px;font-weight:700}
.opt .d{font-size:12px;color:var(--dim)}
.opt[aria-pressed="true"]{--bd:#e0b84a;background-color:var(--panel2)}
.opt[aria-pressed="true"] .t{color:var(--accent)}
.opt:disabled{cursor:default}
.note{font-size:11px;color:var(--dim);margin:4px 0 0}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);background:#1f262e;border-top:4px solid #06080b;box-shadow:inset 0 3px 0 #5d6b7c;z-index:5}

.tab canvas{filter:saturate(.3) brightness(.62)}
.tab[aria-selected="true"]{color:var(--accent);background:#34404d;box-shadow:inset 0 3px 0 var(--accent)}
.tab[aria-selected="true"] canvas{filter:none}
.dot{position:absolute;top:8px;right:calc(50% - 26px);width:8px;height:8px;background:var(--red);box-shadow:0 0 0 2px #080503}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#120c08;--bd:#e0b84a;padding:6px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
.toast.on{opacity:1}

.enrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.enslot{position:relative;min-height:150px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;overflow:hidden}

.enslot .eic{background:#161b22;padding:4px;box-shadow:inset 0 0 0 2px #3a4654}
.enslot .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.25;min-height:2.5em;display:flex;align-items:center;text-shadow:1px 1px 0 #000}
.enslot.lock .lvt,.enslot.lock .eic,.enslot.lock .nm{opacity:.35}
.enslot.lock{cursor:default}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:8px}
.sheet[hidden]{display:none}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.78)}
.scroll{position:relative;width:100%;max-width:380px;display:flex;flex-direction:column;filter:drop-shadow(5px 6px 0 rgba(0,0,0,.6));max-height:calc(100vh - 24px)}
.roller{position:relative;flex:0 0 auto;height:24px;margin:0 6px;z-index:2;box-shadow:inset 0 0 0 2px #1a0d05;
 background:linear-gradient(rgba(20,8,2,.5),rgba(20,8,2,.5)) 14% 8px/12px 5px no-repeat,linear-gradient(rgba(20,8,2,.5),rgba(20,8,2,.5)) 41% 14px/16px 4px no-repeat,linear-gradient(rgba(20,8,2,.55),rgba(20,8,2,.55)) 66% 6px/9px 6px no-repeat,linear-gradient(rgba(20,8,2,.5),rgba(20,8,2,.5)) 86% 13px/14px 5px no-repeat,linear-gradient(rgba(70,150,120,.75),rgba(70,150,120,.75)) 29% 3px/7px 3px no-repeat,linear-gradient(rgba(60,130,105,.7),rgba(60,130,105,.7)) 75% 16px/8px 3px no-repeat,var(--wearC) 0 0/288px 288px,linear-gradient(#f0b27a 0 3px,#c47a3e 3px 9px,#97562a 9px 16px,#4a2410 16px 100%)}
.roller::before,.roller::after{content:"";position:absolute;top:-4px;width:12px;height:32px;background:linear-gradient(rgba(20,8,2,.5),rgba(20,8,2,.5)) 3px 9px/5px 5px no-repeat,linear-gradient(rgba(70,150,120,.8),rgba(70,150,120,.8)) 6px 20px/4px 3px no-repeat,linear-gradient(90deg,#d99058 0 4px,#a8602f 4px 8px,#4a2410 8px 100%);box-shadow:inset 0 0 0 2px #1a0d05}
.roller::before{left:-10px}.roller::after{right:-10px}
.paper{position:relative;flex:1 1 auto;min-height:0;margin:0 8px;display:flex;color:#3b2713;overflow:hidden;animation:unroll .4s steps(8) both}
@keyframes unroll{from{max-height:0}to{max-height:calc(100vh - 80px)}}
@media (prefers-reduced-motion:reduce){.paper{animation:none}}
.edge{flex:0 0 24px;background-repeat:repeat-y;background-size:24px 192px;image-rendering:pixelated}
.edge.l{background-image:var(--edgeL)}
.edge.r{background-image:var(--edgeR)}
.pbody{flex:1;min-width:0;padding:16px 4px 18px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;
 background-color:#d9c08a;background-image:linear-gradient(rgba(60,30,10,.40) 0 3px,rgba(60,30,10,.26) 3px 6px,rgba(60,30,10,.12) 6px 9px,transparent 9px),linear-gradient(0deg,rgba(60,30,10,.40) 0 3px,rgba(60,30,10,.26) 3px 6px,rgba(60,30,10,.12) 6px 9px,transparent 9px),var(--stain),var(--wear);
 background-size:auto,auto,576px 576px,288px 288px;background-repeat:no-repeat,no-repeat,repeat,repeat;background-position:0 0,0 100%,0 0,0 0}
.phead{display:flex;align-items:center;gap:12px}

.pghint{margin:0;font-size:12.5px;line-height:1.55;color:#5a3d1e}

.sheetx:active{transform:translateY(2px)}
.sheetopts{display:flex;flex-direction:column;gap:12px}
.sopt{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px 14px 13px;cursor:pointer;border:0;background:rgba(120,80,30,.08);color:#3b2713;box-shadow:inset 0 0 0 6px rgba(90,55,20,.13)}
.sopt .hd{display:flex;align-items:center;gap:8px}
.sopt .eic{flex:0 0 auto;background:#2b1d13;padding:3px;box-shadow:0 0 0 2px #3b2713}
.sopt .t{font-size:14px;font-weight:700;color:#3b2713}
.sopt .d{font-size:12px;line-height:1.5;color:#5a3d1e}
.sopt.sel{background-color:rgba(255,240,200,.16);box-shadow:inset 0 0 0 6px var(--rcS),0 0 0 6px var(--rcB);animation:selglow 1.8s steps(3) infinite}
@keyframes selglow{0%,100%{box-shadow:inset 0 0 0 6px var(--rcS),0 0 0 6px var(--rcB)}50%{box-shadow:inset 0 0 0 6px var(--rc),0 0 0 6px var(--rcA)}}
@media (prefers-reduced-motion:reduce){.sopt.sel{animation:none}}

.btn,.ghost,.step button{background-image:var(--wear),linear-gradient(180deg,rgba(255,230,180,.10),rgba(0,0,0,.22));background-size:288px 288px,auto}
.tab[aria-selected="true"],.sopt.sel{background-image:var(--wear);background-size:288px 288px}

.chip,.enslot,.ghost,.step button,.seg,.tabs{--panel:#2b1d13;--panel2:#3a2616;--hi:#6b4a2a;--lo:#150c06;--bd:#080503;--dim:#b09a74}
.chip,.enslot{background:var(--wearB) 0 0/288px 288px,linear-gradient(180deg,rgba(255,220,160,.06),rgba(0,0,0,.24)),repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 12px),var(--panel)}
.chip[aria-selected="true"]{--bd:#e0b84a;background-color:var(--panel2)}
.chip.off{background-color:#1d140d;color:#7a6a50}
.ghost,.step button{background-color:#4a3018;background-image:var(--wearB),linear-gradient(180deg,rgba(255,230,180,.10),rgba(0,0,0,.22))}

.seg{background-color:#1a110b;box-shadow:inset 0 0 0 2px #080503,inset 0 4px 0 #6b4a2a}

.tabs{background:#2a1b0f;border-top-color:#080503;box-shadow:inset 0 3px 0 #6b4a2a}
.tab[aria-selected="true"]{background:#3d2814}

.rd.sd{left:auto;top:9px;right:calc(50% - 34px)}
.seg button{position:relative}
.enslot .eic,.sopt .eic{background:none!important;padding:0!important;box-shadow:none!important}
.rune{animation:runeglow 2.6s steps(6) infinite}
@keyframes runeglow{0%,100%{filter:brightness(.82)}50%{filter:brightness(1.3)}}

.sopt{padding:0;gap:0;cursor:default}
.sopt .pick{appearance:none;background:none;border:0;margin:0;font:inherit;color:inherit;text-align:left;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px 8px;cursor:pointer}
.sopt .pick:active:not([disabled]){transform:translateY(2px)}
.sopt .pick:focus-visible{outline:2px solid #4a2a12;outline-offset:-4px}

.sopt.used .pick,.sopt.used details{filter:grayscale(1) brightness(.85);opacity:.55}
.sopt.used .pick{cursor:not-allowed}
.sopt .tt{display:flex;flex-direction:column;min-width:0}
.sopt .sub{font-size:11px;color:#7a5a30;letter-spacing:.06em}
.sopt .usedb{position:absolute;top:8px;right:8px;font-size:11px;line-height:1.6;padding:0 6px;background:#8a2a20;color:#f0dfb8;box-shadow:0 0 0 2px #3b2713;transform:rotate(3deg)}

  if(ns){var from=STAGE_AT[stage(s.lv)];var bar=el('div','bar');var f=el('i');f.style.width=((s.lv-from)/(ns-from)*100)+'%';bar.appendChild(f);i.appendChild(bar);i.appendChild(el('div','barcap','Lv'+ns+' 外觀進化'))}
  else{var bar2=el('div','bar');var f2=el('i');f2.style.width='100%';bar2.appendChild(f2);i.appendChild(bar2);i.appendChild(el('div','barcap','已是最終外觀'))}
  h.appendChild(i)}
function renderActs(){var k=S.cur,s=ST[k],h=document.getElementById('acts');h.textContent='';
  function mk(label,sub,dis,fn,hold){var b=el('button','btn');b.type='button';b.appendChild(el('span',null,label));b.appendChild(el('small',null,sub));b.disabled=dis;
    if(!dis){if(hold){var iv,to,fired=false;var stop=function(){clearTimeout(to);clearInterval(iv)};
      b.addEventListener('pointerdown',function(e){fired=false;fn();fired=true;to=setTimeout(function(){iv=setInterval(function(){if(!fn())stop()},80)},380)});
      ['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,stop)});
      b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
      else b.addEventListener('click',fn)}
    h.appendChild(b)}
  if(s.lv>=100){mk('已滿級','Lv 100',true,null);mk('已滿級','—',true,null);return}
  var c=cost(s.lv),need=c-S.stones;
  mk('升級','需 '+num(c)+(need>0?'・還差 '+num(need):''),need>0,function(){var ok=upOne(k);if(ok)render(false);return ok},true);
  var nt=nextTemperLv(k),ct=costTo(k,nt),need2=ct-S.stones;
  mk('升到 Lv'+nt,'共 '+num(ct)+(need2>0?'・還差 '+num(need2):'')+(nt%5===0?'・淬火點':''),need2>0,function(){var n=upToNext(k);if(n)toast('升了 '+n+' 級');render(false);return n>0},false)}
function renderSeg(){var h=document.getElementById('seg');h.textContent='';
  [['up','升級'],['tm','淬火'],['en','附魔']].forEach(function(t){var b=el('button',null,t[1]);var pd=pend(S.cur);if((t[0]==='tm'&&pd.tm)||(t[0]==='en'&&pd.en))b.appendChild(el('i','rd sd'));b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(S.tab===t[0]));
    b.addEventListener('click',function(){S.tab=t[0];renderSeg();renderPanel()});h.appendChild(b)})}
function renderPanel(){var h=document.getElementById('panel');h.textContent='';var pn=document.getElementById('pnote');pn.textContent='';var k=S.cur,s=ST[k],w=W[k];
  if(S.tab==='up'){
    var nx=atk(k,s.lv+1),cu=atk(k,s.lv);var sum=el('div','sum');
    var d=[];if(w.phys)d.push({l:'物攻',v:String(nx.p-cu.p)});if(w.mag)d.push({l:'魔攻',v:String(nx.m-cu.m)});
    var l1=el('div');l1.appendChild(document.createTextNode('下一級:'));l1.appendChild(el('b',null,s.lv>=100?'—':grp(d.concat(w.auto.map(function(a){return {l:a.l,v:fmt(a.per)+a.u}})))));sum.appendChild(l1);
    sum.appendChild(el('div',null,'下個淬火點:Lv'+(s.lv>=100?100:nextTemperLv(k))+'(目前累計 '+totalPts(s.lv)+' 點)'));h.appendChild(sum);
    var g=el('div','stages');
    for(var i=0;i<4;i++){var c=el('div','stage'+(stage(s.lv)===i?' now':'')+(s.lv<STAGE_AT[i]?' lock':''));var bg=el('div','bg');bg.appendChild(cv(wsprite(k,i),2));c.appendChild(bg);c.appendChild(el('span',null,'Lv'+STAGE_AT[i]));g.appendChild(c)}
    h.appendChild(g);
  }else if(S.tab==='tm'){
    var tot=totalPts(s.lv),used=usedPts(k),left=tot-used;
    var p=el('div','pts');var l=el('div');l.appendChild(document.createTextNode('剩餘點數 '));var bg=el('span','big',String(left));l.appendChild(bg);l.appendChild(document.createTextNode(' / '+tot));p.appendChild(l);
    var rs=el('button','ghost','重洗(免費)');rs.type='button';rs.disabled=used===0;rs.addEventListener('click',function(){s.pts=[0,0,0];toast('已重洗');renderPanel();refreshDots()});p.appendChild(rs);h.appendChild(p);
    w.temper.forEach(function(o,i){var r=el('div','temper');r.appendChild(el('div','t',o.l+'(每點 +'+fmt(o.per)+o.u+')'));
      var b=el('div','b');b.appendChild(document.createTextNode('Lv '+s.pts[i]+' = '));var em=el('em',null,'+'+fmt(o.per*s.pts[i])+o.u);b.appendChild(em);r.appendChild(b);
      var st=el('div','step');var m=el('button',null,'−');m.type='button';m.setAttribute('aria-label',o.l+' 減一點');m.disabled=s.pts[i]<=0;m.addEventListener('click',function(){s.pts[i]--;renderPanel();refreshDots()});
      var n=el('span','n',String(s.pts[i]));var pl=el('button',null,'+');pl.type='button';pl.setAttribute('aria-label',o.l+' 加一點');pl.disabled=left<=0;pl.addEventListener('click',function(){s.pts[i]++;renderPanel();refreshDots()});
      st.appendChild(m);st.appendChild(n);st.appendChild(pl);r.appendChild(st);h.appendChild(r)});
    pn.appendChild(el('p','note','每 5 級得 1 點,滿級共 20 點。單一選項沒有上限,可以全部投同一個。'));
  }else{
    var row=el('div','enrow');
    REQ.forEach(function(req,ti){var locked=s.lv<req,id=s.ench[ti],r=id?RUNE[id]:null;
      var b=el('button','enslot'+(locked?' lock':'')+(r?' has':''));b.type='button';b.dataset.ti=ti;
      b.setAttribute('aria-label',TN[ti]+'階 Lv'+req+(locked?'，未解鎖':r?'，'+r.name:'，未選擇'));
      b.appendChild(el('span','lvt',TN[ti]+'階・Lv'+req));var ic=el('span','eic');ic.appendChild(runeCv(locked?null:id,64,false));b.appendChild(ic);
      b.appendChild(el('span','nm',locked?'Lv'+req+' 解鎖':r?r.name:'選擇符文'));
      if(!locked&&!r)b.appendChild(el('i','rd'));
      b.addEventListener('click',function(){if(locked)toast('Lv'+req+' 解鎖，還差 '+(req-s.lv)+' 級');else openSheet(k,ti)});row.appendChild(b)});
    h.appendChild(row);
    var act=[0,1,2].filter(function(ti){return s.ench[ti]&&s.lv>=REQ[ti]&&RUNE[s.ench[ti]]});
    if(act.length){var lst=el('div','enlist');lst.appendChild(el('div','enhd','生效中的符文'));
      act.forEach(function(ti){var r=RUNE[s.ench[ti]],it=el('div','enit');it.appendChild(runeCv(r.id,32,false));var tx=el('div','tx');
        tx.appendChild(el('b',null,TN[ti]+'階・'+r.name));tx.appendChild(el('span','dd',r.desc));it.appendChild(tx);lst.appendChild(it)});h.appendChild(lst)}
    pn.appendChild(el('p','note','點選欄位挑選符文。一／二／三階分別在 Lv30／60／90 解鎖，三階同時生效，可以隨時更換；同一個符文不能重複選。'));
  }}
function pend(k){var s=ST[k];var tm=totalPts(s.lv)-usedPts(k)>0;var en=REQ.some(function(req,ti){return s.lv>=req&&!s.ench[ti]});return {tm:tm,en:en,any:tm||en}}
function refreshDots(){renderChips();renderSeg();renderTabs()}
function renderTabs(){var h=document.getElementById('tabs');h.textContent='';
  var items=[['camp','營地','camp'],['forge','鍛造','forge'],['adv','冒險','map'],['party','隊伍','banner'],['set','設定','scroll']];
  var afford=ORDER.some(function(k){return pend(k).any});
  items.forEach(function(it){var b=el('button','tab');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(it[0]==='forge'));
    b.appendChild(cv(make(ICON[it[2]].draw),3));b.appendChild(el('span',null,it[1]));
    if(it[0]==='camp'||(it[0]==='forge'&&afford))b.appendChild(el('i','dot'));
    if(it[0]!=='forge')b.addEventListener('click',function(){toast('「'+it[1]+'」頁面尚未製作')});h.appendChild(b)})}
function render(scroll){renderTop();renderChips();renderCard();renderActs();renderSeg();renderPanel();renderTabs();}
/* 外層重繪時保持分頁內容同步 */
var _r=render;render=function(sc){_r(sc)};
getCSVs();
function getCSVs(){Promise.all(['weapon_info.csv','rune_info.csv','weapon_rune.csv'].map(getCSV)).then(buildData).then(function(){
    if(!ORDER.length)throw new Error('weapon_info.csv 沒有資料');
    ORDER.forEach(function(k){ST[k]={lv:1,pts:[0,0,0],ench:[null,null,null]}});
    if(!W[S.cur])S.cur=ORDER[0];if(!W[EQUIPPED])EQUIPPED=ORDER[0];
    document.getElementById('loading').remove();render(true)})
  .catch(function(e){var m=document.getElementById('loading');m.textContent='資料載入失敗：'+e.message+'（請用網址開啟，不能直接用檔案開啟）';m.classList.add('err')})}
})();
</script>
