var G='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
var JOBN=Doll.JOBN; /* filled from job_info.csv by Doll.load */
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function motto(){var p=el('p','motto');p.appendChild(document.createTextNode('今天的工作進度：'));p.appendChild(el('b',null,'討伐史萊姆'));p.appendChild(document.createTextNode('。'));return p}
function withFB(cb){if(window.FB)cb(window.FB);else window.addEventListener('fb-ready',function(){cb(window.FB)},{once:true})}
var box=document.getElementById('content'),foot=document.getElementById('foot'),RAF=0;
function btn(cls,t,fn){var b=el('button',cls,t);b.type='button';b.addEventListener('click',fn);return b}
function show(state,data,user){box.textContent='';foot.textContent='';cancelAnimationFrame(RAF);
  box.appendChild(el('h2',null,'冒險者公會・告示'));
  if(state==='loading'){box.appendChild(motto());box.appendChild(el('div','state dots',data||'推開公會大門'))}
  else if(state==='login'){box.appendChild(motto());var w=el('div','gwrap'),b=btn('gbtn',null,doSignIn);b.innerHTML=G+'<span>使用 Google 帳戶登入</span>';w.appendChild(b);box.appendChild(w);
    box.appendChild(el('div','state','登入後就能開始今天的冒險'))}
  else if(state==='new'){box.appendChild(el('p','motto','歡迎，新的冒險者！'));box.appendChild(el('div','state dots','帶你前往冒險者登記處'))}
  else if(state==='back'){var wl=el('div','welcome'),db=el('div','dollbox'),c=el('canvas');c.width=c.height=48*4;c.style.width=c.style.height='192px';db.appendChild(c);wl.appendChild(db);
    wl.appendChild(el('div','hi','歡迎回來，'+data.name+'（'+(JOBN[data.job]||'冒險者')+'）'));box.appendChild(wl);box.appendChild(el('div','state dots','前往營地'));
    Doll.load('assets/','4').then(function(){var s={skin:Doll.val(data.skin,0),style:Doll.val(data.style,0),hair:data.hair|0,eyes:Doll.val(data.eyes,5),outfit:data.outfit==null?(data.job|0):Doll.val(data.outfit,0),weapon:null,shield:null,halo:[]};
      (function lp(t){Doll.draw(c,s,t);RAF=requestAnimationFrame(lp)})(0)})}
  else if(state==='disabled'){box.appendChild(el('p','motto','這個帳號已停用'));box.appendChild(el('div','state','冒險者公會暫時收回了你的通行證。如果有疑問，請聯絡遊戲管理員。'))}
  else if(state==='error'){box.appendChild(motto());box.appendChild(el('div','err',data||'登入沒有成功，請再試一次。'));box.appendChild(btn('btn2','再試一次',function(){location.reload()}))}
  else if(state==='inapp'){box.appendChild(el('p','motto','請改用瀏覽器開啟'));box.appendChild(el('div','state','LINE、Facebook 裡的瀏覽器不能用 Google 登入。'));
    var ol=el('ol','steps');['點右上角的「⋯」或分享圖示','選「用預設瀏覽器開啟」或「在 Safari / Chrome 開啟」','打開後再按登入'].forEach(function(t){ol.appendChild(el('li',null,t))});box.appendChild(ol);
    box.appendChild(btn('btn2','複製網址',function(){var u=location.href.split('?')[0];(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){this_.textContent='已複製'},function(){prompt('複製這個網址',u)})}));var this_=box.lastChild}
  if(user){foot.appendChild(el('span',null,'目前登入：'+(user.email||'')));foot.appendChild(btn(null,'切換帳號',function(){window.FB.signOut().then(function(){show('login')})}))}
  else foot.appendChild(el('span',null,'Demo 版・資料可能會重置'))}
function route(u){if(!u){show('login');return}
  show('loading','確認你的冒險者身分',u);
  window.FB.getPlayer(u.uid).then(function(p){
    if(p&&p.disabled){show('disabled',null,u);return}
    if(p){show('back',p,u);setTimeout(function(){location.href='camp/'},2200)}
    else{show('new',null,u);setTimeout(function(){location.href='create/'},1600)}
  }).catch(function(e){show('error','讀取角色資料失敗（'+(e.code||e.message)+'）',u)})}
function doSignIn(){window.FB.signIn().then(route).catch(function(e){var c=e&&e.code||'';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'){show('login');return}
  if(c==='auth/popup-blocked'){show('error','登入視窗被瀏覽器擋住了，請允許彈出視窗後再試一次。');return}
  if(c==='auth/unauthorized-domain'){show('error','這個網址還沒加入 Firebase 的授權網域。');return}
  show('error','登入沒有成功（'+(c||e.message)+'）')})}
show('loading');
var timer=setTimeout(function(){if(!window.FB)show('error','連不上登入服務，請檢查網路後再試一次。')},12000);
withFB(function(FB){clearTimeout(timer);if(FB.inApp()){show('inapp');return}FB.ready.then(route)});
})();
</script>
