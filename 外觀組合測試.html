<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外觀組合測試</title>
<style>
:root{--bg:#f1ede4;--card:#fffdf7;--ink:#2a251c;--mute:#7b705c;--acc:#8a5a2b;--line:#d9ccb2;--stage:#cfd3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16130e;--card:#211c14;--ink:#eee3cc;--mute:#a19478;--acc:#d9a45b;--line:#3a3022;--stage:#3a3d42}}
:root[data-theme="dark"]{--bg:#16130e;--card:#211c14;--ink:#eee3cc;--mute:#a19478;--acc:#d9a45b;--line:#3a3022;--stage:#3a3d42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Noto Sans TC","PingFang TC",sans-serif}
#app{max-width:620px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0}h2{font-size:15px;margin:0 0 8px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
canvas{display:block;image-rendering:pixelated;background:var(--stage);border-radius:8px;max-width:100%}
#main{margin:0 auto;width:256px;height:256px}
#party{width:100%}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px}
.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.opt img{image-rendering:pixelated;width:48px;height:48px;background:var(--stage);border-radius:4px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.sl{display:grid;grid-template-columns:56px 1fr 44px;gap:8px;align-items:center;margin:4px 0}
.sl input{width:100%}
pre{margin:0;font-size:12px;white-space:pre-wrap;word-break:break-all;color:var(--mute)}
small{color:var(--mute)}
</style>
</head>
<body>
<div id="app">
<h1>外觀組合測試</h1>
<div class="card">
  <canvas id="main" width="256" height="256"></canvas>
  <div class="row" style="justify-content:center;margin-top:8px">
    <button class="opt" id="dirBtn">↔ 換面向</button>
    <button class="opt" id="walkBtn">行走：開</button>
  </div>
</div>
<div class="card"><h2>職業（身體）</h2><div class="row" id="bodies"></div></div>
<div class="card"><h2>膚色</h2><div class="row" id="skins"></div></div>
<div class="card"><h2>髮型</h2><div class="row" id="hairs"></div></div>
<div class="card"><h2>髮色（色相／飽和度／亮度）</h2>
  <div class="row" id="presets" style="margin-bottom:6px"></div>
  <div class="sl"><span>色相</span><input id="sh" type="range" min="-180" max="180"><b id="vh"></b></div>
  <div class="sl"><span>飽和度</span><input id="ss" type="range" min="0" max="200"><b id="vs"></b></div>
  <div class="sl"><span>亮度</span><input id="sl" type="range" min="-50" max="70"><b id="vl"></b></div>
</div>
<div class="card"><h2>眼睛</h2><div class="row" id="eyes"></div></div>
<div class="card"><h2>武器</h2><small>尚未上傳，之後會畫在最底層（武器、皮膚、身體、眼睛、髮型）。</small></div>
<div class="card"><h2>存進資料庫的內容</h2><pre id="json"></pre></div>
<div class="card"><h2>隊伍預覽</h2>
  <canvas id="party" width="576" height="116"></canvas>
  <div class="row" style="margin-top:8px"><button class="opt" id="reroll">🎲 重新隨機</button></div>
</div>
</div>

const RC={};
function recolor(i,h,s,l){const key=i+'|'+h+'|'+s+'|'+l;if(RC[key])return RC[key];
  const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');g.drawImage(IM.hair[i],0,0);
  const d=g.getImageData(0,0,32,32),p=d.data;
  for(let k=0;k<p.length;k+=4){if(!p[k+3])continue;
    let[H,Sa,L]=rgb2hsl(p[k],p[k+1],p[k+2]);
    H=((H+h/360)%1+1)%1;Sa=Math.min(1,Sa*s/100);const b=l/100;L=b>0?L+(1-L)*b:L*(1+b);
    const[r,gg,bb]=hsl2rgb(H,Sa,Math.max(0,Math.min(1,L)));p[k]=r;p[k+1]=gg;p[k+2]=bb;}
  g.putImageData(d,0,0);return RC[key]=c;}

const CC={};
function compose(L){const key=JSON.stringify(L);if(CC[key])return CC[key];
  const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');
  g.drawImage(IM.skin[L.skin],0,0);g.drawImage(IM.body[L.body],0,0);g.drawImage(IM.eye[L.eye-1],0,0);
  g.drawImage(recolor(L.hair,L.h,L.s,L.l),0,0);return CC[key]=c;}

function put(g,spr,x,y,sc,d){g.save();g.translate(x+(d<0?32*sc:0),y);g.scale(d<0?-sc:sc,sc);g.drawImage(spr,0,0);g.restore();}

function rand(a){return a[Math.floor(Math.random()*a.length)];}
function randLook(){const p=rand(PRESETS);return{hair:Math.floor(Math.random()*5),h:p[1],s:p[2],l:p[3],eye:1+Math.floor(Math.random()*8),skin:rand(['A','B','C']),body:rand(BODIES)[0]};}
function reroll(){party=[];for(let i=0;i<6;i++)party.push(randLook());}

function btn(parent,html,fn){const b=document.createElement('button');b.className='opt';b.innerHTML=html;b.onclick=fn;parent.appendChild(b);return b;}
const groups={};
function build(){
  groups.body=BODIES.map(([k,n])=>btn($('bodies'),n,()=>{look.body=k;refresh();}));
  groups.skin=['A','B','C'].map(k=>btn($('skins'),'<span class="dot" style="background:'+SKINC[k]+'"></span>'+k,()=>{look.skin=k;refresh();}));
  groups.hair=D.hair.map((s,i)=>btn($('hairs'),'<img src="'+s+'">',()=>{look.hair=i;refresh();}));
  groups.eye=EYEC.map((c,i)=>btn($('eyes'),'<span class="dot" style="background:'+c+'"></span>'+(i+1),()=>{look.eye=i+1;refresh();}));
  PRESETS.forEach(p=>btn($('presets'),p[0],()=>{look.h=p[1];look.s=p[2];look.l=p[3];refresh();}));
  $('sh').oninput=e=>{look.h=+e.target.value;refresh();};
  $('ss').oninput=e=>{look.s=+e.target.value;refresh();};
  $('sl').oninput=e=>{look.l=+e.target.value;refresh();};
  $('dirBtn').onclick=()=>{dir=-dir;};
  $('walkBtn').onclick=()=>{walk=!walk;$('walkBtn').textContent='行走：'+(walk?'開':'關');};
  $('reroll').onclick=reroll;
}
function mark(arr,idx){arr.forEach((b,i)=>b.classList.toggle('on',i===idx));}
function refresh(){
  mark(groups.body,BODIES.findIndex(b=>b[0]===look.body));
  mark(groups.skin,['A','B','C'].indexOf(look.skin));
  mark(groups.hair,look.hair);mark(groups.eye,look.eye-1);
  $('sh').value=look.h;$('ss').value=look.s;$('sl').value=look.l;
  $('vh').textContent=look.h;$('vs').textContent=look.s;$('vl').textContent=look.l;
  $('json').textContent=JSON.stringify({hair:'hair_0'+(look.hair+1),hairHSL:[look.h,look.s,look.l],eye:'eye_'+look.eye,skin:look.skin,body:'body_'+look.body});
}

function loop(t){
  const m=$('main').getContext('2d');m.imageSmoothingEnabled=false;m.clearRect(0,0,256,256);
  m.fillStyle='rgba(0,0,0,.15)';m.fillRect(0,31*S,256,S);
  put(m,compose(look),0,walk?-(Math.floor(t/180)%2)*S:0,S,dir);
  const p=$('party').getContext('2d');p.imageSmoothingEnabled=false;p.clearRect(0,0,576,116);
  p.fillStyle='rgba(0,0,0,.15)';p.fillRect(0,31*3+10,576,6);
  p.fillStyle='rgba(0,0,0,.2)';const off=(t*0.05)%24;for(let x=-24;x<600;x+=24)p.fillRect(x-off,31*3+16,12,4);
  party.forEach((L,i)=>put(p,compose(L),i*96,10-(walk?(Math.floor(t/180+i)%2)*3:0),3,1));
  requestAnimationFrame(loop);
}

(async function(){
  IM.hair=await Promise.all(D.hair.map(load));IM.eye=await Promise.all(D.eye.map(load));
  for(const k in D.skin)IM.skin[k]=await load(D.skin[k]);
  for(const k in D.body)IM.body[k]=await load(D.body[k]);
  build();reroll();refresh();requestAnimationFrame(loop);
})();
</script>
